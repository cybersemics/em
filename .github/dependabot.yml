# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference

version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/' # Location of package file
    # Run late Saturday night so dependency PRs don't compete with weekday work
    # for concurrency-throttled BrowserStack runs.
    schedule:
      interval: 'weekly'
      day: 'saturday'
      time: '22:00'
      timezone: 'America/New_York'
    open-pull-requests-limit: 10
    # Replaces Dependabot's default labels, which are `dependencies` plus an ecosystem label.
    # The ecosystem label (`javascript` here, `rust` on the cargo entry) is dropped by omitting it:
    # nothing filters or routes on it, and the branch name already says which ecosystem a bump is
    # from. `dependencies` must be listed to be kept.
    labels:
      - 'dependencies'
    # The Tauri npm packages must stay on the same major.minor as their Rust crates, or `tauri build`
    # fails (enforced on pull requests by `yarn lint:tauri-versions`). The cargo entry below leads:
    # its `tauri` group moves the crates, and the npm side follows on that pull request. Letting npm
    # move a minor on its own is how #5781 broke the desktop build on main.
    ignore:
      - dependency-name: '@tauri-apps/api'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
      - dependency-name: '@tauri-apps/plugin-*'
        update-types: ['version-update:semver-minor', 'version-update:semver-major']
    # Group related deps into single PR
    groups:
      babel:
        patterns:
          - '@babel/*'
      capacitor:
        patterns:
          - '@capacitor/*'
      eslint:
        patterns:
          - 'eslint'
          - 'eslint-*'
          - 'eslint-plugin-*'
          - 'eslint-config-*'
          - '@typescript-eslint/*'
          - '@stylistic/*'
      jest:
        patterns:
          - 'jest'
          - 'jest-*'
          - 'jest-environment-*'
          - '@types/jest'
          - '@types/jest-*'
      lodash:
        patterns:
          - 'lodash'
          - '@types/lodash'
      mui-emotion:
        patterns:
          - '@mui/*'
          - '@emotion/*'
      pandacss:
        patterns:
          - '@pandacss/*'
      prettier:
        patterns:
          - 'prettier'
          - '@trivago/prettier-plugin-*'
      react:
        patterns:
          - 'react'
          - 'react-dom'
          - '@types/react'
          - '@types/react-dom'
      react-dnd:
        patterns:
          - 'react-dnd*'
          - 'dnd-core'
      redux:
        patterns:
          - 'redux'
          - 'redux-*'
          - 'react-redux'
          - 'reselect'
          - 'redux-mock-store'
          - '@types/react-redux'
          - '@types/redux-mock-store'
      sinon-fake-timers:
        patterns:
          - '@sinonjs/fake-timers'
          - '@types/sinonjs__fake-timers'
      testing-library:
        patterns:
          - '@testing-library/*'
      vitest-vite:
        patterns:
          - 'vitest'
          - 'vitest-*'
          - 'vite'
          - 'vite-*'
          - '@vitejs/*'
      wdio:
        patterns:
          - '@wdio/*'
      workbox:
        patterns:
          - 'workbox-*'

  # The desktop app's Rust crates. Only the Tauri crates are updated, all in one pull request: they
  # are the ones whose versions the npm packages must match. Pull requests only compile the Rust
  # code (tauri-check.yml) and nothing runs the desktop app, so a bump to any other crate would land
  # with no evidence it still works.
  - package-ecosystem: 'cargo'
    directory: '/desktop'
    # Same slot as npm above.
    schedule:
      interval: 'weekly'
      day: 'saturday'
      time: '22:00'
      timezone: 'America/New_York'
    labels:
      - 'dependencies'
    allow:
      - dependency-name: 'tauri'
      - dependency-name: 'tauri-*'
    groups:
      tauri:
        patterns:
          - 'tauri'
          - 'tauri-*'
