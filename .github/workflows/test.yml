name: Test

# `yarn test` is `vitest --project unit`, which only ever reads src/. Documentation, agent/editor
# configuration, and the native platform projects are invisible to it, so a change set confined to
# them has nothing to test.
#
# paths-ignore skips the workflow outright, which means NO check is reported — not a "skipped"
# check, and not a synthetic pass from a job-level `if`. That is only correct because Test is no
# longer a required status check on main. If it is ever made required again, filtered PRs will sit
# at "Expected — Waiting for status to be reported" and block; use a job-level guard then.
# (Lint is deliberately left unfiltered and required, so every PR still reports one check.)
#
# A run is skipped only when EVERY changed file matches, so any PR that also touches app or test
# code still runs in full. `**/*.md` is safe because nothing under src/ imports markdown, and none
# of the native directories contains a JS or TS file.
on:
  push:
    branches:
      - main
    paths-ignore:
      # Documentation and agent/editor configuration.
      - '**/*.md'
      - 'docs/**'
      - '.github/instructions/**'
      - '.github/skills/**'
      - '.claude/**'
      - '.agents/**'
      - '.vscode/**'
      - '.hooks/**'
      # Native platform projects, and the icon/splash sources generated into them.
      - 'android/**'
      - 'ios/**'
      - 'desktop/**'
      - 'assets/**'
  pull_request:
    branches:
      - '**'
    # GitHub Actions does not support YAML anchors, so this list is duplicated from `push` above.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/instructions/**'
      - '.github/skills/**'
      - '.claude/**'
      - '.agents/**'
      - '.vscode/**'
      - '.hooks/**'
      - 'android/**'
      - 'ios/**'
      - 'desktop/**'
      - 'assets/**'
  workflow_dispatch:
    inputs:
      rerun_id:
        description: 'Optional ID for tracking repeated runs'
        required: false

# Supersede the in-progress run when a pull request is pushed again; its result is about to be
# replaced anyway. Only pull_request runs are grouped: `github.ref` is `refs/pull/<n>/merge` there,
# so it is already per-PR. (vercel-preview.yml must key on the PR number instead because
# pull_request_target sets github.ref to the base branch.)
#
# Every other event falls back to github.run_id, which is unique per run and therefore never
# collides. That is deliberate, and not the same as cancel-in-progress: false — a shared group with
# cancellation off *queues* runs, and GitHub cancels a pending run when a newer one queues behind
# it. Pushes to main each need their own result to identify the commit that broke the build, and the
# `ghworkflow` flake hunt (docs/testing.md § Triggering GitHub Actions workflows manually) fans out
# many workflow_dispatch runs on one ref that must all run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true
  COPILOT_AGENT_FIREWALL_ALLOW_LIST_ADDITIONS: googlechromelabs.github.io,storage.googleapis.com
  # Skip Puppeteer's Chrome download on install — none of this workflow's jobs uses the bundled
  # browser (Puppeteer tests attach to the browserless/chrome service via CDP; only
  # shared-chrome.yml launches the bundled browser), saving ~20s per install.
  PUPPETEER_SKIP_DOWNLOAD: true

jobs:
  run:
    name: Test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.changed_files > 0

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install npm dependencies
        uses: ./.github/actions/install

      - name: Test
        run: yarn test
