name: BrowserStack

# Documentation, agent/editor configuration, and the native platform projects cannot change what
# this workflow tests, so a change set confined to them has nothing for a real device to exercise.
# Skipping is worth more here than in a cheap workflow: every run occupies the repo-wide
# `browserstack` concurrency group below and a slot in the shared BrowserStack session pool, so one
# pointless run delays every other PR's iOS tests behind it.
#
# paths-ignore skips the workflow outright, which means NO check is reported — not a "skipped"
# check, and not a synthetic pass from a job-level `if`. That is only correct because BrowserStack
# is no longer a required status check on main. If it is ever made required again, filtered PRs
# will sit at "Expected — Waiting for status to be reported" and block; use a job-level guard then.
# (Lint is deliberately left unfiltered and required, so every PR still reports one check.)
#
# A run is skipped only when EVERY changed file matches, so any PR that also touches app or test
# code still runs in full. `**/*.md` is safe because nothing under src/ imports markdown.
#
# The native entries below rest on `yarn build` staying web-only (build:packages, build:styles,
# vite build) and on this workflow testing mobile Safari over a tunnel rather than the Capacitor
# app. None of those directories contains a JS or TS file today. If a Capacitor asset is ever wired
# into the Vite build, remove them — otherwise a real change would ship untested.
on:
  push:
    branches:
      - main
    paths-ignore:
      # Documentation and agent/editor configuration.
      - '**/*.md'
      - 'docs/**'
      - '.github/instructions/**'
      - '.github/hooks/**'
      - '.github/skills/**'
      - '.claude/**'
      - '.agents/**'
      - '.vscode/**'
      - '.hooks/**'
      # Native platform projects, and the icon/splash sources generated into them.
      - 'android/**'
      - 'ios/**'
      - 'desktop/**'
      - 'assets/**'
  pull_request_target:
    types: [opened, synchronize, reopened]
    # GitHub Actions does not support YAML anchors, so this list is duplicated from `push` above.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/instructions/**'
      - '.github/hooks/**'
      - '.github/skills/**'
      - '.claude/**'
      - '.agents/**'
      - '.vscode/**'
      - '.hooks/**'
      - 'android/**'
      - 'ios/**'
      - 'desktop/**'
      - 'assets/**'
  workflow_dispatch:
    inputs:
      rerun_id:
        description: 'Optional ID for tracking repeated runs'
        required: false

# Concurrency is layered across two groups because two requirements pull in opposite directions:
# BrowserStack usage must be serialized repo-wide (queue, never cancel), while commits to the same
# PR must supersede each other (cancel, never queue). One group cannot do both, but GitHub allows a
# workflow-level group and a job-level group in the same workflow, and they are independent.
#
# This workflow-level group handles per-PR superseding. Each PR gets its own group with
# cancel-in-progress, so a new commit cancels the PR's previous run whether it is still waiting for
# the BrowserStack gate or already mid-suite — only the newest head is worth a device session, and
# the repo-wide queue below routinely holds runs for 30-50 minutes, long enough for several pushes.
# Non-PR runs (push to main, workflow_dispatch) get a unique group per run: superseding is only
# wanted within a PR, every main commit should be tested, and workflow_dispatch runs are fanned out
# deliberately for flake hunting (see ghworkflow in docs/testing.md), so none of these may cancel
# each other. Serialization for them is enforced by the job-level gate, not here.
#
# The repo-wide `browserstack` gate lives on the `run` job (see below). It queues because every run
# draws from the same shared parallel-session pool, so overlapping runs (a main push + PR syncs +
# reruns) can over-subscribe it and fail with session-creation timeouts. (The Cloudflare tunnel pool
# tolerates concurrent connectors on its own — see cloudflareTunnelPool.ts's self-verifying claim —
# so that serialization is purely about the BrowserStack session cap, not the tunnel.)
#
# Tradeoff, accepted: a suite cancelled mid-run leaves its BrowserStack session to expire on the
# provider's idle timeout instead of closing cleanly, briefly counting against the pool. That costs
# less than what it replaces — running entire suites against superseded commits.
concurrency:
  group: ${{ github.event_name == 'pull_request_target' && format('browserstack-pr-{0}', github.event.pull_request.number) || format('browserstack-run-{0}', github.run_id) }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true
  COPILOT_AGENT_FIREWALL_ALLOW_LIST_ADDITIONS: googlechromelabs.github.io,storage.googleapis.com
  # Skip Puppeteer's Chrome download on install — none of this workflow's jobs uses the bundled
  # browser (Puppeteer tests attach to the browserless/chrome service via CDP; only
  # agent-scripts.yml launches the bundled browser), saving ~20s per install.
  PUPPETEER_SKIP_DOWNLOAD: true
  # Activates the console proxy (src/util/consoleProxy.ts), which we need because BrowserStack
  # can't access iOS console logs.
  VITE_BROWSER_CONSOLE_CAPTURE: 1

jobs:
  run:
    name: BrowserStack
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request_target' || github.event.pull_request.changed_files > 0

    # The repo-wide gate — see the concurrency comment at the top of the file for why it sits at the
    # job level (it must coexist with the per-PR workflow-level group; a workflow gets only one
    # group per level). A run waiting here holds no runner. cancel-in-progress: false queues runs
    # instead of cancelling them, and queue: max extends the pending queue from the default single
    # slot to the maximum of 100 so queued runs are not silently dropped.
    concurrency:
      group: browserstack
      cancel-in-progress: false
      queue: max

    # The cancel step below needs actions: write, and declaring any permission zeroes the rest, so
    # everything the job uses is listed. contents: read is for checkout; nothing else uses the token.
    permissions:
      contents: read
      actions: write
      pull-requests: read

    steps:
      # A run can wait 30-50 minutes at the `browserstack` gate above, and its PR may merge or close
      # in the meantime. A merge triggers this workflow's own `push` run on main, so testing the
      # merged code again here proves nothing while holding a device session for the whole suite and
      # delaying every PR queued behind it. The job-level `if:` cannot catch this — it is evaluated
      # when the run is created, while the PR is still open — so the state is re-read here, as the
      # first step after the gate admits the job. Cancelling (rather than exiting green) is honest:
      # no test ran, so nothing may report as passed. `state` is "closed" for merged and abandoned
      # PRs alike, and neither is worth a device session. Same-PR staleness needs no check here —
      # the workflow-level group already cancelled superseded runs of an open PR.
      - name: Cancel if PR is no longer open
        if: github.event_name == 'pull_request_target'
        env:
          GH_TOKEN: ${{github.token}}
          REPO: ${{github.repository}}
          PR_NUMBER: ${{github.event.pull_request.number}}
          RUN_ID: ${{github.run_id}}
        run: |
          STATE=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq .state)
          if [ "$STATE" = 'open' ]; then
            echo "PR #$PR_NUMBER is open — proceeding."
            exit 0
          fi
          echo "PR #$PR_NUMBER is $STATE — cancelling this run. Merged code is covered by the push run on main."
          gh api --method POST "repos/$REPO/actions/runs/$RUN_ID/cancel"
          # Cancellation is asynchronous — the runner kills this step when it lands, normally within
          # seconds. If it has not landed after a minute, fail loudly rather than build a dead PR.
          sleep 60
          echo "Cancellation did not land within 60s."
          exit 1

      # Check out the PR by head SHA, not by branch name. A bare branch name makes actions/checkout
      # build a wildcard refspec (`+refs/heads/<name>*:refs/remotes/origin/<name>*`), and a wildcard
      # that matches nothing makes `git fetch` exit 1 with an *empty* stderr — so a branch deleted on
      # merge killed this step with a bare "The process '/usr/bin/git' failed with exit code 1" and
      # no iOS test ran. The cancel step above turns away already-merged runs, but a PR can still
      # merge in the window between that check and this one, so the checkout has to be robust on its
      # own rather than relying on the guard.
      #
      # A SHA is fetched exactly, and GitHub keeps a PR's head commit reachable in the base repo (via
      # refs/pull/<n>/head) even after the branch is gone — for fork PRs too, which is why
      # `repository:` is not needed here. It also pins the run to the commit the event actually fired
      # for, rather than whatever the branch tip has become. On push and workflow_dispatch the
      # expression is empty and checkout falls back to the triggering ref.
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          ref: ${{github.event.pull_request.head.sha}}
          # v6 (upgraded from v4 in #3981) refuses to check out fork PR code from a
          # pull_request_target workflow unless this is set. Untrusted fork code is
          # gated by GitHub's "require approval for outside collaborators" setting.
          # https://gh.io/securely-using-pull_request_target
          allow-unsafe-pr-checkout: true

      # `pull_request_target` runs the workflow file from the default branch but checks out the PR's
      # head code, which may predate the tunnel-token gate. Detect whether the checked-out code has
      # that gate so we only generate a token when one is needed, and only send it when the server
      # expects it. The gate arrived with the HTTPS dev server migration, so plugin-basic-ssl is the
      # marker for it. Note this says nothing about the protocol any more: the Serve step forces
      # HTTP=1, so the dev server is plain HTTP either way.
      - name: Detect token gate
        id: server_mode
        run: |
          if grep -q "@vitejs/plugin-basic-ssl" vite.config.ts; then
            echo "has_token_gate=true" >> "$GITHUB_OUTPUT"
            echo "Token gate: present"
          else
            echo "has_token_gate=false" >> "$GITHUB_OUTPUT"
            echo "Token gate: absent (PR predates the HTTPS dev server migration)"
          fi

      - name: Enable Corepack
        run: corepack enable

      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install npm dependencies
        uses: ./.github/actions/install

      - name: Build
        run: yarn build

      - name: Generate tunnel token
        if: steps.server_mode.outputs.has_token_gate == 'true'
        run: |
          TOKEN=$(openssl rand -hex 16)
          echo "::add-mask::$TOKEN"
          echo "TUNNEL_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Serve
        env:
          HAS_TOKEN_GATE: ${{ steps.server_mode.outputs.has_token_gate }}
        run: |
          # Bind 0.0.0.0 (--host) so the app is reachable via the runner's localhost by the
          # cloudflared connector (which the wdio config starts). Capture the PID and tee output
          # to serve.log so the readiness loop and the cleanup step can use them.
          # HTTP=1 forces a plain-HTTP origin here: Cloudflare's tunnel already terminates HTTPS at its edge for Safari (a real CA-signed cert on the public hostname), so this local connector-to-origin hop never needs its own TLS.
          HTTP=1 yarn servebuild --host > serve.log 2>&1 &
          echo "APP_PID=$!" >> "$GITHUB_ENV"

          echo "Waiting for server to be ready..."
          # Code with the gate rejects an untokened request with 403, so the probe has to carry the
          # token; code without it has no token to carry. Either way the origin is plain HTTP.
          if [ "$HAS_TOKEN_GATE" = "true" ]; then
            TOKEN_PARAM="?__token=$TUNNEL_TOKEN"
          else
            TOKEN_PARAM=""
          fi
          for i in {1..30}; do
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:3000$TOKEN_PARAM" 2>/dev/null || echo "000")
            if [ "$HTTP_STATUS" = "200" ]; then
              echo "Server is ready!"
              break
            fi
            echo "Attempt $i/30: status $HTTP_STATUS"
            if [ $i -eq 30 ]; then
              echo "Server failed to respond after 30 attempts. Server log:"
              cat serve.log || true
              exit 1
            fi
            sleep 1
          done

      - name: Test iOS on BrowserStack
        run: yarn test:ios
        env:
          BROWSERSTACK_USERNAME: ${{secrets.BROWSERSTACK_USERNAME}}
          BROWSERSTACK_ACCESS_KEY: ${{secrets.BROWSERSTACK_ACCESS_KEY}}
          BROWSERSTACK_BUILD_NAME: 'CI - ${{github.run_id}}'
          BROWSERSTACK_PROJECT_NAME: 'em'
          TUNNEL_TOKEN: ${{env.TUNNEL_TOKEN}}
          # A JSON array of { name, hostname, token }, provisioned out-of-band — see
          # cloudflareTunnelPool.ts. The wdio config checks each tunnel's occupancy before attaching
          # to it, claims the first one that is genuinely free, and waits for a slot if they are all
          # busy — so a dead or already-claimed tunnel doesn't block the run.
          CLOUDFLARE_TUNNEL_POOL: ${{secrets.CLOUDFLARE_TUNNEL_POOL}}

      # Best-effort cleanup on the ephemeral runner: stop the manually-started app and preserve
      # the named connector's log for diagnosis. The connector process itself is killed by the
      # wdio config's onComplete hook.
      - name: Stop app
        if: always()
        run: |
          if [ -n "$APP_PID" ]; then
            kill "$APP_PID" 2>/dev/null || true
          fi

      - name: Upload cloudflared connector log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: cloudflared-browserstack-log
          path: cloudflared-browserstack.log
          if-no-files-found: ignore
