# Daily Puppeteer flaky-test detector.
#
# Runs the full Puppeteer test suite repeatedly on `main` and aggregates Vitest
# JSON reports to identify flaky tests. This automates routine flake detection
# without adding load to the PR CI pipeline.
#
# Runs:
#   - Twice daily on cron (03:00 and 07:00 UTC — quiet overnight CI hours)
#   - Manually: `gh workflow run puppeteer-flaky.yml -f iterations=5`
#
# Optimizations:
#   - Builds once and reuses the artifact across all iterations
#   - Uploads trimmed Vitest reports only for failed iterations
#
# Reports:
#   - Workflow summary
#   - A tracking issue per intermittently failing test (labelled `test`),
#     deduplicated against open issues by exact title match. Tests that fail
#     every iteration are regressions, not flakes, and are not filed.
#   - Optional Discord notification (flakes/infra failures only), linking each
#     offender to its tracking issue — the one just filed, or the one already open.
#
# Follow-up:
#   - A GitHub Copilot cloud agent task (Opus 5, the `worker-bee` agent) per issue
#     just filed, so a new flake is being worked on before anyone reads the alert.
#
# To enable Discord notifications, add a `DISCORD_WEBHOOK_URL` repository secret.
# To enable Copilot follow-up, add a `COPILOT_TASKS_TOKEN` repository secret — a
# fine-grained PAT with the "Agent tasks" repository permission (read and write).

name: Puppeteer Flaky

on:
  schedule:
    - cron: '0 3 * * *' # 03:00 UTC
  workflow_dispatch:
    inputs:
      iterations:
        description: 'Number of full-suite test iterations (1–50)'
        required: false
        default: '15'
        type: string

concurrency:
  group: puppeteer-flaky
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true
  COPILOT_AGENT_FIREWALL_ALLOW_LIST_ADDITIONS: googlechromelabs.github.io,storage.googleapis.com
  # Skip Puppeteer's Chrome download on install — tests attach to browserless via CDP.
  PUPPETEER_SKIP_DOWNLOAD: true

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  setup:
    name: Setup matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      iterations: ${{ steps.gen.outputs.iterations }}
    steps:
      - name: Generate iteration matrix
        id: gen
        run: |
          set -euo pipefail
          RAW='${{ github.event.inputs.iterations }}'
          N="${RAW:-15}"
          if ! [[ "$N" =~ ^[0-9]+$ ]] || [ "$N" -lt 1 ] || [ "$N" -gt 50 ]; then
            echo "iterations must be an integer between 1 and 50 (got: $N)" >&2
            exit 1
          fi
          # JSON array [1, 2, ..., N] for strategy.matrix.iteration
          MATRIX="[$(seq -s, 1 "$N")]"
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "iterations=$N" >> "$GITHUB_OUTPUT"
          echo "Will run $N test iteration(s): $MATRIX"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Enable Corepack
        run: corepack enable

      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install npm dependencies
        uses: ./.github/actions/install

      - name: Build
        run: yarn build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: build/
          retention-days: 1

  test:
    name: Test ${{ matrix.iteration }}
    needs: [setup, build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        iteration: ${{ fromJSON(needs.setup.outputs.matrix) }}
    services:
      browserless:
        image: ghcr.io/browserless/chromium:v2.56.2
        ports:
          - 7566:3000
        env:
          TIMEOUT: 0
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Install Microsoft Core Fonts
        run: ./src/e2e/puppeteer/install-browserless-fonts.sh '${{ job.services.browserless.id }}'

      - name: Enable Corepack
        run: corepack enable

      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install npm dependencies
        uses: ./.github/actions/install

      - name: Download build artifact
        uses: actions/download-artifact@v7
        with:
          name: build
          path: build

      - name: Serve
        uses: ./.github/actions/serve

      - name: Test
        # continue-on-error so a failed suite can still upload its vitest JSON.
        # Successful iterations upload nothing; missing JSON ⇒ passed (see flaky-report.mjs).
        continue-on-error: true
        id: test
        run: |
          mkdir -p flaky-results
          set +e
          yarn test:puppeteer \
            --reporter=default \
            --reporter=json \
            --outputFile=flaky-results/iteration-${{ matrix.iteration }}.json
          status=$?
          set -e
          exit "$status"

      - name: Trim artifact to failed tests only
        if: steps.test.outcome == 'failure'
        run: |
          REPORT="flaky-results/iteration-${{ matrix.iteration }}.json"
          if [ ! -f "$REPORT" ]; then
            echo "Test failed but no vitest JSON was written; nothing to upload."
            exit 0
          fi
          node scripts/flaky-report.mjs --trim "$REPORT"

      - name: Upload failure report
        if: steps.test.outcome == 'failure'
        uses: actions/upload-artifact@v7
        with:
          name: flaky-results-${{ matrix.iteration }}
          path: flaky-results/iteration-${{ matrix.iteration }}.json
          if-no-files-found: ignore
          retention-days: 7

  report:
    name: Report
    needs: [setup, test]
    # setup provides the iteration count; skip if the matrix was never generated
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Download failure reports
        # Clean runs upload zero artifacts; ignore "not found" so aggregation still runs.
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: flaky-results-*
          path: flaky-results
          merge-multiple: true

      - name: Aggregate flaky-test report
        id: aggregate
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ITERATIONS: ${{ needs.setup.outputs.iterations }}
        run: |
          set +e
          mkdir -p flaky-results
          node scripts/flaky-report.mjs flaky-results "$ITERATIONS" "$RUN_URL" > report.md
          STATUS=$?
          set -e

          cat report.md >> "$GITHUB_STEP_SUMMARY"

          node scripts/ci/flaky-outputs.mjs flaky-results/flaky-summary.json >> "$GITHUB_OUTPUT"
          echo "aggregate_exit=$STATUS" >> "$GITHUB_OUTPUT"

      # Runs before the Discord alert so it can link each offender to its tracking issue.
      # See scripts/ci/file-flaky-issues.cjs for what gets filed and how it is deduplicated.
      - name: File tracking issues
        if: steps.aggregate.outputs.clean != 'true'
        # The Discord alert is the signal humans act on; never suppress it because the Issues
        # API failed. The run still fails below regardless.
        continue-on-error: true
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            await require('./scripts/ci/file-flaky-issues.cjs')({ github, context, core })

      - name: Notify Discord
        if: steps.aggregate.outputs.clean != 'true'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          FLAKE_COUNT: ${{ steps.aggregate.outputs.flake_count }}
          INFRA_COUNT: ${{ steps.aggregate.outputs.infra_count }}
        run: |
          set -euo pipefail
          if [ -z "${DISCORD_WEBHOOK_URL:-}" ]; then
            echo "DISCORD_WEBHOOK_URL secret not set; skipping Discord notification."
            exit 0
          fi

          CONTENT=$(node scripts/ci/flaky-discord-payload.mjs \
            flaky-results/flaky-summary.json \
            flaky-results/flaky-issues.json)

          curl -sS -f -X POST \
            -H 'Content-Type: application/json' \
            -d "$CONTENT" \
            "$DISCORD_WEBHOOK_URL"
          echo "Discord notification sent."

      # Runs after the Discord alert so a human is told about the flake even if the dispatch fails.
      # Uses a PAT, not GITHUB_TOKEN: the agent tasks API rejects app installation tokens.
      - name: Start Copilot tasks
        if: steps.aggregate.outputs.clean != 'true'
        # A failed dispatch is worth seeing but must not change the job's result — the run already
        # fails below on the flake itself.
        continue-on-error: true
        env:
          COPILOT_TASKS_TOKEN: ${{ secrets.COPILOT_TASKS_TOKEN }}
        run: |
          set -euo pipefail
          node scripts/ci/start-copilot-tasks.mjs flaky-results/flaky-issues.json | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Fail job when flakes or infra failures found
        if: steps.aggregate.outputs.clean != 'true'
        run: |
          echo "Flakes and/or infra failures detected — see the job summary and tracking issue."
          exit 1
