# This workflow runs when a new issue is opened. It assigns the best-matching open milestone, and
# stays silent when it succeeds — the milestone is the whole result. When it cannot confidently
# choose one, it posts a comment asking the maintainer for a category instead, which is a normal
# outcome and not a failure. It can also be dispatched manually against any issue number.
name: Issue Classifier
on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to classify'
        required: true

permissions:
  # To assign the milestone, and to post the question when the selection is not confident enough.
  issues: write
  # To read the prompt and samples from scripts/issue-classifier/.
  contents: read

env:
  # Skip Puppeteer's Chrome download on install — the issue-classifier workspace never uses a browser,
  # saving ~20s per install.
  PUPPETEER_SKIP_DOWNLOAD: true

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # Corepack activates the Yarn 4 pinned in package.json's packageManager field. Without it the
      # runner's preinstalled Yarn 1 handles `yarn install`, which does not understand --immutable.
      - name: Enable Corepack
        run: corepack enable
      - uses: actions/setup-node@v6
        with:
          # Node 24 strips TypeScript types natively, so src/*.ts runs with no build step or tsx.
          node-version: 24
          cache: 'yarn'
      - run: yarn install --immutable
      - name: Build issue-classifier workspace
        run: yarn workspace em-issue-classifier build
      - name: Classify issue
        run: node scripts/issue-classifier/src/issue.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OpenAI API key used for the milestone selection inference call (issue.ts).
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          # Empty for the issues event, where the issue number comes from the event payload instead.
          ISSUE_NUMBER: ${{ inputs.issue }}
