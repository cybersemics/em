name: Puppeteer

# Documentation, agent/editor configuration, repository tooling, the native platform projects, and
# unrelated workflow files cannot change what this workflow tests, so a change set confined to them
# has nothing for a browser to exercise. Nor can the code that is outside the web build:
# packages/ai is a separate Vercel service reached over HTTP, eslint-plugin-em is loaded only by
# eslint.config.js, the scripts/ workspaces are CI automation, and src/e2e/iOS belongs to
# BrowserStack. Test filters none of those — it collects their unit tests — so the two lists differ
# deliberately; see docs/testing.md § Path filtering.
#
# paths-ignore skips the workflow outright, which means NO check is reported — not a "skipped"
# check, and not a synthetic pass from a job-level `if`. That is only correct because Puppeteer is
# no longer a required status check on main. If it is ever made required again, filtered PRs will
# sit at "Expected — Waiting for status to be reported" and block; use a job-level guard then.
# (Lint is deliberately left unfiltered and required, so every PR still reports one check.)
#
# A run is skipped only when EVERY changed file matches, so any PR that also touches app or test
# code still runs in full. `**/*.md` is safe because nothing under src/ imports markdown.
#
# The native entries below rest on `yarn build` staying web-only (build:packages, build:styles,
# vite build). None of those directories contains a JS or TS file today, and the web favicons come
# from public/, not assets/. If a Capacitor asset is ever wired into the Vite build, remove them.
on:
  push:
    branches:
      - main
    paths-ignore:
      # Documentation and agent/editor configuration.
      - '**/*.md'
      - 'docs/**'
      - '.github/instructions/**'
      - '.github/skills/**'
      - '.github/agents/**'
      - '.claude/**'
      - '.agents/**'
      - '.vscode/**'
      - '.hooks/**'
      # Native platform projects, and the icon/splash sources generated into them.
      - 'android/**'
      - 'ios/**'
      - 'desktop/**'
      - 'assets/**'
      # Repository tooling no run here reads: formatter, linter, and dependency-checker config, the
      # Capacitor and Vercel manifests, the standalone icon generator (its own Yarn project, not a
      # root workspace), and the TDD annotator script.
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.prettierignore'
      - '.prettierrc.json'
      - '.ncurc.js'
      - '.depcheckrc.json'
      - 'eslint.config.js'
      - 'tsconfig.eslint.json'
      - 'capacitor.config.ts'
      - 'vercel.json'
      - 'scripts/icons/**'
      - '.github/scripts/**'
      - '.github/dependabot.yml'
      # Workflows that cannot change this one's result. Named individually rather than as
      # '.github/workflows/**' so that editing THIS file still runs it: paths-ignore has no
      # exception syntax, and `!` works only in `paths`, which would invert the safe default to
      # "never runs". A workflow added later is simply not on this list, so it runs — wasteful,
      # never wrong.
      - '.github/workflows/agent-scripts.yml'
      - '.github/workflows/cancel-pr-runs.yml'
      - '.github/workflows/copilot-*.yml'
      - '.github/workflows/dependabot-*.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/estimate-*.yml'
      - '.github/workflows/issue-classifier.yml'
      - '.github/workflows/lint.yml'
      - '.github/workflows/pr-ready.yml'
      - '.github/workflows/preview-qr.yml'
      - '.github/workflows/tauri-release-*.yml'
      - '.github/workflows/tdd.yml'
      - '.github/workflows/update-browserslist.yml'
      - '.github/workflows/vercel-*.yml'
      # Outside the web build: packages/ai is a separate Vercel service the app reaches over HTTP,
      # eslint-plugin-em is loaded only by eslint.config.js, and the scripts/ workspaces are CI
      # automation. `yarn build` builds packages/webview and nothing else here.
      - 'packages/ai/**'
      - 'packages/eslint-plugin-em/**'
      - 'scripts/ci/**'
      - 'scripts/estimate/**'
      - 'scripts/issue-classifier/**'
      # The other browser suite. The two share no imports.
      - 'src/e2e/iOS/**'
  pull_request:
    branches:
      - '**'
    # GitHub Actions does not support YAML anchors, so this list is duplicated from `push` above.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/instructions/**'
      - '.github/skills/**'
      - '.github/agents/**'
      - '.claude/**'
      - '.agents/**'
      - '.vscode/**'
      - '.hooks/**'
      - 'android/**'
      - 'ios/**'
      - 'desktop/**'
      - 'assets/**'
      - '.editorconfig'
      - '.gitattributes'
      - '.gitignore'
      - '.prettierignore'
      - '.prettierrc.json'
      - '.ncurc.js'
      - '.depcheckrc.json'
      - 'eslint.config.js'
      - 'tsconfig.eslint.json'
      - 'capacitor.config.ts'
      - 'vercel.json'
      - 'scripts/icons/**'
      - '.github/scripts/**'
      - '.github/dependabot.yml'
      - '.github/workflows/agent-scripts.yml'
      - '.github/workflows/cancel-pr-runs.yml'
      - '.github/workflows/copilot-*.yml'
      - '.github/workflows/dependabot-*.yml'
      - '.github/workflows/docs.yml'
      - '.github/workflows/estimate-*.yml'
      - '.github/workflows/issue-classifier.yml'
      - '.github/workflows/lint.yml'
      - '.github/workflows/pr-ready.yml'
      - '.github/workflows/preview-qr.yml'
      - '.github/workflows/tauri-release-*.yml'
      - '.github/workflows/tdd.yml'
      - '.github/workflows/update-browserslist.yml'
      - '.github/workflows/vercel-*.yml'
      - 'packages/ai/**'
      - 'packages/eslint-plugin-em/**'
      - 'scripts/ci/**'
      - 'scripts/estimate/**'
      - 'scripts/issue-classifier/**'
      - 'src/e2e/iOS/**'
  workflow_dispatch:
    inputs:
      rerun_id:
        description: 'Optional ID for tracking repeated runs'
        required: false

# Supersede the in-progress run when a pull request is pushed again; its result is about to be
# replaced anyway. Only pull_request runs are grouped: `github.ref` is `refs/pull/<n>/merge` there,
# so it is already per-PR. (vercel-preview.yml must key on the PR number instead because
# pull_request_target sets github.ref to the base branch.)
#
# Every other event falls back to github.run_id, which is unique per run and therefore never
# collides. That is deliberate, and not the same as cancel-in-progress: false — a shared group with
# cancellation off *queues* runs, and GitHub cancels a pending run when a newer one queues behind
# it. Pushes to main each need their own result to identify the commit that broke the build, and the
# `ghworkflow` flake hunt (docs/testing.md § Triggering GitHub Actions workflows manually) fans out
# many workflow_dispatch runs on one ref that must all run.
#
# Cancelling is safe for the downstream pair: puppeteer-diff-comment.yml acts only on a `success`
# or `failure` conclusion, so a cancelled run posts nothing from its partial artifacts. The
# browserless service container lives inside the job and dies with it — nothing is shared across
# runs the way ios.yml's BrowserStack session pool is, which is why that one queues instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true
  COPILOT_AGENT_FIREWALL_ALLOW_LIST_ADDITIONS: googlechromelabs.github.io,storage.googleapis.com
  # Skip Puppeteer's Chrome download on install — none of this workflow's jobs uses the bundled
  # browser (Puppeteer tests attach to the Browserless Chromium service via CDP; only
  # agent-scripts.yml launches the bundled browser), saving ~20s per install.
  PUPPETEER_SKIP_DOWNLOAD: true

jobs:
  run:
    name: Puppeteer
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.changed_files > 0
    services:
      browserless:
        image: ghcr.io/browserless/chromium:v2.56.2
        ports:
          - 7566:3000
        env:
          TIMEOUT: 0

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Install Microsoft Core Fonts
        run: ./src/e2e/puppeteer/install-browserless-fonts.sh '${{ job.services.browserless.id }}'

      - name: Enable Corepack
        run: corepack enable

      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install npm dependencies
        uses: ./.github/actions/install

      - name: Build
        run: yarn build

      - name: Serve
        uses: ./.github/actions/serve

      - name: Test
        run: yarn test:puppeteer

      - name: Upload snapshot diff artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: __diff_output__
          path: src/e2e/puppeteer/__tests__/__image_snapshots__/**/__diff_output__/
          if-no-files-found: ignore

      # Carry the PR number to the privileged workflow_run job. github.event.workflow_run.pull_requests
      # is empty for fork PRs, so the number must be passed via an artifact. Uploaded on every PR run
      # (success or failure) so the comment can be posted on failure and pruned/resolved on success.
      - name: Save PR number
        if: always() && github.event_name == 'pull_request'
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt

      - name: Upload PR number artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pr-number
          path: pr-number.txt
          if-no-files-found: ignore
