name: Puppeteer

# Documentation, agent/editor configuration, and the native platform projects cannot change what
# this workflow tests, so a change set confined to them has nothing for a browser to exercise.
#
# paths-ignore skips the workflow outright, which means NO check is reported — not a "skipped"
# check, and not a synthetic pass from a job-level `if`. That is only correct because Puppeteer is
# no longer a required status check on main. If it is ever made required again, filtered PRs will
# sit at "Expected — Waiting for status to be reported" and block; use a job-level guard then.
# (Lint is deliberately left unfiltered and required, so every PR still reports one check.)
#
# A run is skipped only when EVERY changed file matches, so any PR that also touches app or test
# code still runs in full. `**/*.md` is safe because nothing under src/ imports markdown.
#
# The native entries below rest on `yarn build` staying web-only (build:packages, build:styles,
# vite build). None of those directories contains a JS or TS file today, and the web favicons come
# from public/, not assets/. If a Capacitor asset is ever wired into the Vite build, remove them.
on:
  push:
    branches:
      - main
    paths-ignore:
      # Documentation and agent/editor configuration.
      - '**/*.md'
      - 'docs/**'
      - '.github/instructions/**'
      - '.github/skills/**'
      - '.claude/**'
      - '.agents/**'
      - '.vscode/**'
      - '.hooks/**'
      # Native platform projects, and the icon/splash sources generated into them.
      - 'android/**'
      - 'ios/**'
      - 'desktop/**'
      - 'assets/**'
  pull_request:
    branches:
      - '**'
    # GitHub Actions does not support YAML anchors, so this list is duplicated from `push` above.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.github/instructions/**'
      - '.github/skills/**'
      - '.claude/**'
      - '.agents/**'
      - '.vscode/**'
      - '.hooks/**'
      - 'android/**'
      - 'ios/**'
      - 'desktop/**'
      - 'assets/**'
  workflow_dispatch:
    inputs:
      rerun_id:
        description: 'Optional ID for tracking repeated runs'
        required: false
      diagnostic_browser:
        description: 'Browserless version for the standalone diagnostic branch'
        type: choice
        default: v2
        options: [v1, v2]
      focus_startup:
        description: 'Run only the three startup-sensitive test cases'
        type: boolean
        default: false
      compare_scheduler:
        description: 'Run full Chrome 151 suites with default scheduling and deferral disabled on the same runner'
        type: boolean
        default: false
      scheduler_order:
        description: 'Order of the two scheduler-control phases'
        type: choice
        default: default-first
        options: [default-first, disabled-first]
      compare_transport:
        description: 'Run pre-migration main without observers, changing only HTTP/2'
        type: boolean
        default: false
      transport_order:
        description: 'Order of the pre-migration transport phases'
        type: choice
        default: original-first
        options: [original-first, http1-first]
      compare_nodelay:
        description: 'Three-phase Chrome 151 control changing only server TCP_NODELAY'
        type: boolean
        default: false
      nodelay_order:
        description: 'Reverse the three-phase packet-delay control'
        type: choice
        default: default-first
        options: [default-first, nodelay-first]

# Supersede the in-progress run when a pull request is pushed again; its result is about to be
# replaced anyway. Only pull_request runs are grouped: `github.ref` is `refs/pull/<n>/merge` there,
# so it is already per-PR. (vercel-preview.yml must key on the PR number instead because
# pull_request_target sets github.ref to the base branch.)
#
# Every other event falls back to github.run_id, which is unique per run and therefore never
# collides. That is deliberate, and not the same as cancel-in-progress: false — a shared group with
# cancellation off *queues* runs, and GitHub cancels a pending run when a newer one queues behind
# it. Pushes to main each need their own result to identify the commit that broke the build, and the
# `ghworkflow` flake hunt (docs/testing.md § Triggering GitHub Actions workflows manually) fans out
# many workflow_dispatch runs on one ref that must all run.
#
# Cancelling is safe for the downstream pair: puppeteer-diff-comment.yml acts only on a `success`
# or `failure` conclusion, so a cancelled run posts nothing from its partial artifacts. The
# browserless service container lives inside the job and dies with it — nothing is shared across
# runs the way ios.yml's BrowserStack session pool is, which is why that one queues instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true
  COPILOT_AGENT_FIREWALL_ALLOW_LIST_ADDITIONS: googlechromelabs.github.io,storage.googleapis.com
  # Skip Puppeteer's Chrome download on install — none of this workflow's jobs uses the bundled
  # browser (Puppeteer tests attach to the Browserless Chromium service via CDP; only
  # agent-scripts.yml launches the bundled browser), saving ~20s per install.
  PUPPETEER_SKIP_DOWNLOAD: true

jobs:
  run:
    name: Puppeteer
    runs-on: ubuntu-latest
    if: ${{ !inputs.compare_transport && !inputs.compare_nodelay && (github.event_name != 'pull_request' || github.event.pull_request.changed_files > 0) }}
    services:
      browserless:
        image: ${{ inputs.diagnostic_browser == 'v1' && 'browserless/chrome:latest' || 'ghcr.io/browserless/chromium:v2.56.2' }}
        ports:
          - 7566:3000
        env:
          TIMEOUT: 0
          CONNECTION_TIMEOUT: -1

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Install Microsoft Core Fonts
        if: inputs.diagnostic_browser != 'v1'
        run: ./src/e2e/puppeteer/install-browserless-fonts.sh '${{ job.services.browserless.id }}'

      - name: Enable Corepack
        run: corepack enable

      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install npm dependencies
        uses: ./.github/actions/install

      - name: Build
        run: yarn build

      - name: Serve
        uses: ./.github/actions/serve

      - name: Test
        run: |
          if [ "$COMPARE_SCHEDULER" = "true" ]; then
            if [ "$DIAG_BROWSER" != "v2" ]; then
              echo 'Scheduler comparison requires v2.' >&2
              exit 2
            fi
            phases=(default disabled)
            if [ "$SCHEDULER_ORDER" = "disabled-first" ]; then phases=(disabled default); fi
            failed=0
            for phase in "${phases[@]}"; do
              disabled=false
              if [ "$phase" = "disabled" ]; then disabled=true; fi
              code=0
              DIAG_DISABLE_DEFER="$disabled" DIAG_RUN="ci-$phase" yarn test:puppeteer --run --config .desktop-diagnostic-vitest.ts --reporter=default --reporter=json --outputFile="/tmp/em-desktop-summary-ci-$phase.json" || code=$?
              echo "SCHEDULER_PHASE_RESULT $phase $code"
              if [ "$code" != "0" ]; then failed=1; fi
            done
            exit "$failed"
          elif [ "$FOCUS_STARTUP" = "true" ]; then
            yarn test:puppeteer --run --config .desktop-diagnostic-vitest.ts undo drag-and-drop-multiselect render-thoughts -t 'Font Size: 18.*long list of siblings|undoes and redoes contiguous note typing with its caret|should drop multiple thoughts as siblings before target'
          else
            yarn test:puppeteer --run --config .desktop-diagnostic-vitest.ts
          fi
        env:
          DIAG_BROWSER: ${{ inputs.diagnostic_browser || 'v2' }}
          DIAG_V1_PORT: '7566'
          DIAG_CAPTURE: '2'
          DIAG_RUN: ci
          FOCUS_STARTUP: ${{ inputs.focus_startup }}
          COMPARE_SCHEDULER: ${{ inputs.compare_scheduler }}
          SCHEDULER_ORDER: ${{ inputs.scheduler_order }}
          DIAG_TRACE: ${{ inputs.compare_scheduler && '1' || '0' }}

      - name: Upload desktop input diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-input-diagnostics
          path: /tmp/em-desktop-*-ci-*.json
          retention-days: 7
          if-no-files-found: error

      - name: Upload snapshot diff artifact
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: __diff_output__
          path: src/e2e/puppeteer/__tests__/__image_snapshots__/**/__diff_output__/
          if-no-files-found: ignore

      # Carry the PR number to the privileged workflow_run job. github.event.workflow_run.pull_requests
      # is empty for fork PRs, so the number must be passed via an artifact. Uploaded on every PR run
      # (success or failure) so the comment can be posted on failure and pruned/resolved on success.
      - name: Save PR number
        if: always() && github.event_name == 'pull_request'
        run: echo "${{ github.event.pull_request.number }}" > pr-number.txt

      - name: Upload PR number artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: pr-number
          path: pr-number.txt
          if-no-files-found: ignore

  transport:
    name: Pre-migration transport control
    if: github.event_name == 'workflow_dispatch' && inputs.compare_transport && !inputs.compare_nodelay
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      browserless:
        image: browserless/chrome:latest
        ports:
          - 7566:3000
        env:
          CONNECTION_TIMEOUT: -1
    steps:
      - name: Check out exact pre-migration main
        uses: actions/checkout@v6
        with:
          ref: 2d98cbf2e5812f4a5ca946b757c73be47164652d

      - name: Record baseline identity
        run: |
          git rev-parse HEAD
          git status --porcelain
          docker inspect '${{ job.services.browserless.id }}' --format '{{.Image}}'
          docker image inspect browserless/chrome:latest --format '{{json .RepoDigests}}'

      - name: Enable Corepack
        run: corepack enable

      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install npm dependencies
        uses: ./.github/actions/install

      - name: Build
        run: yarn build

      - name: Serve
        uses: ./.github/actions/serve

      - name: Compare original and HTTP/1-only transport without observers
        env:
          TRANSPORT_ORDER: ${{ inputs.transport_order }}
        run: |
          phases=(original http1)
          if [ "$TRANSPORT_ORDER" = "http1-first" ]; then phases=(http1 original); fi
          failed=0
          for phase in "${phases[@]}"; do
            export TRANSPORT_PHASE="$phase"
            node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import { execFileSync } from 'node:child_process'
          const path = 'src/e2e/puppeteer-environment.ts'
          const original = execFileSync('git', ['show', `HEAD:${path}`], { encoding: 'utf8' })
          const marker = "      '--ignore-certificate-errors',"
          if (original.split(marker).length !== 2 || original.includes('--disable-http2')) {
            throw new Error('Unexpected baseline environment; refusing to modify it.')
          }
          fs.writeFileSync(path, process.env.TRANSPORT_PHASE === 'http1'
            ? original.replace(marker, `${marker}\n      '--disable-http2',`)
            : original)
          NODE
            git diff -- src/e2e/puppeteer-environment.ts
            code=0
            yarn test:puppeteer --run --reporter=default --reporter=json --outputFile="/tmp/em-transport-$phase.json" || code=$?
            echo "TRANSPORT_PHASE_RESULT $phase $code"
            if [ "$code" != "0" ]; then failed=1; fi
            # Probe a separate page after the suite, never instrument the test pages.
            node --input-type=module <<'NODE'
          import fs from 'node:fs'
          import puppeteer from 'puppeteer-core'
          const source = fs.readFileSync('src/e2e/puppeteer-environment.ts', 'utf8')
          const args = [...source.matchAll(/'(--[^']+)'/g)].map(match => match[1])
          const browser = await puppeteer.connect({ browserWSEndpoint: `ws://localhost:7566?${args.join('&')}` })
          try {
            const context = await browser.createBrowserContext()
            const page = await context.newPage()
            await page.goto('https://172.17.0.1:3000/favicon.ico')
            const protocol = await page.evaluate(() => performance.getEntriesByType('navigation')[0].nextHopProtocol)
            const session = await browser.target().createCDPSession()
            const commandLine = await session.send('Browser.getBrowserCommandLine')
            const result = { phase: process.env.TRANSPORT_PHASE, version: await browser.version(), protocol, commandLine }
            fs.writeFileSync(`/tmp/em-transport-${process.env.TRANSPORT_PHASE}-browser.json`, JSON.stringify(result, null, 2))
            console.log(JSON.stringify(result))
            await context.close()
          } finally {
            await browser.disconnect()
          }
          NODE
          done
          exit "$failed"

      - name: Upload transport results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: transport-control
          path: /tmp/em-transport-*.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload snapshot differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: __diff_output__
          path: src/e2e/puppeteer/__tests__/__image_snapshots__/**/__diff_output__/
          if-no-files-found: ignore

  nodelay:
    name: Chrome 151 packet-delay control
    if: github.event_name == 'workflow_dispatch' && inputs.compare_nodelay
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      browserless:
        image: ghcr.io/browserless/chromium:v2.56.2
        ports:
          - 7566:3000
        env:
          TIMEOUT: 0
    steps:
      - name: Check out exact migration test revision
        uses: actions/checkout@v6
        with:
          ref: 7f2592741f845fb640337d89f9b40a652b15d6c0

      - name: Record identity and install original test fonts
        run: |
          git rev-parse HEAD
          docker inspect '${{ job.services.browserless.id }}' --format '{{.Image}}'
          docker image inspect ghcr.io/browserless/chromium:v2.56.2 --format '{{json .RepoDigests}}'
          ./src/e2e/puppeteer/install-browserless-fonts.sh '${{ job.services.browserless.id }}'

      - name: Enable Corepack
        run: corepack enable

      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install npm dependencies
        uses: ./.github/actions/install

      - name: Build once for all three phases
        run: yarn build

      - name: Compare packet delay without test observers
        env:
          NODELAY_ORDER: ${{ inputs.nodelay_order }}
        run: |
          phases=(default nodelay default)
          if [ "$NODELAY_ORDER" = "nodelay-first" ]; then phases=(nodelay default nodelay); fi
          failed=0
          preview_pid=''
          trap 'if [ -n "$preview_pid" ]; then kill "$preview_pid" 2>/dev/null || true; fi' EXIT
          for index in 0 1 2; do
            export NODELAY_PHASE="$index-${phases[$index]}"
            export NODELAY_ENABLED="${phases[$index]}"
            # Same Vite config/build as `vite preview --port 3000 --host`.
            # Start a fresh server in EVERY phase, not only the intervention.
            node --input-type=module <<'NODE' &
          import { preview } from 'vite'
          const server = await preview({ preview: { host: true, port: 3000, strictPort: true } })
          if (process.env.NODELAY_ENABLED === 'nodelay') {
            server.httpServer.on('secureConnection', socket => socket.setNoDelay(true))
          }
          console.log('PACKET_CONTROL_SERVER', process.env.NODELAY_PHASE, process.version)
          NODE
            preview_pid=$!
            ready=false
            for attempt in {1..30}; do
              if ! kill -0 "$preview_pid" 2>/dev/null; then echo 'Preview exited unexpectedly'; exit 2; fi
              status=$(curl -s -o /dev/null -w '%{http_code}' -k https://localhost:3000 || true)
              if [ "$status" = '200' ]; then ready=true; break; fi
              sleep 1
            done
            if [ "$ready" != true ]; then echo 'Preview did not become ready'; exit 2; fi
            git diff --exit-code -- src package.json yarn.lock vite.config.ts vitest.config.ts
            code=0
            yarn test:puppeteer --run --reporter=default --reporter=json --outputFile="/tmp/em-nodelay-$NODELAY_PHASE.json" || code=$?
            echo "NODELAY_PHASE_RESULT $NODELAY_PHASE $code"
            if [ "$code" != 0 ]; then failed=1; fi
            # Only this separate post-suite page collects timing; test pages are untouched.
            node --input-type=module <<'NODE' || failed=1
          import fs from 'node:fs'
          import puppeteer from 'puppeteer-core'
          const source = fs.readFileSync('src/e2e/puppeteer-environment.ts', 'utf8')
          const args = [...source.matchAll(/'(--[^']+)'/g)].map(match => match[1])
          const launch = Buffer.from(JSON.stringify({ args, defaultViewport: null })).toString('base64')
          const browser = await puppeteer.connect({ browserWSEndpoint: `ws://localhost:7566/chromium?launch=${encodeURIComponent(launch)}` })
          try {
            const context = await browser.createBrowserContext()
            const page = await context.newPage()
            await page.goto('https://172.17.0.1:3000/favicon.ico')
            const timing = await page.evaluate(async () => {
              performance.clearResourceTimings()
              for (let i = 0; i < 3; i++) {
                for (const file of ['wa-sqlite.mjs', 'sqlite-api.js', 'sqlite-constants.js']) {
                  const response = await fetch('/wa-sqlite/' + file, { cache: 'no-store' })
                  if (!response.ok) throw new Error('Resource probe failed: ' + response.status)
                  await response.arrayBuffer()
                }
              }
              return performance.getEntriesByType('resource').map(entry => entry.toJSON())
            })
            const session = await browser.target().createCDPSession()
            const commandLine = await session.send('Browser.getBrowserCommandLine')
            const result = { phase: process.env.NODELAY_PHASE, version: await browser.version(), commandLine, timing }
            fs.writeFileSync(`/tmp/em-nodelay-${process.env.NODELAY_PHASE}-browser.json`, JSON.stringify(result, null, 2))
            console.log(JSON.stringify(result))
            if (timing.length !== 9 || timing.some(entry => entry.nextHopProtocol !== 'http/1.1')) {
              throw new Error('Invalid control: expected nine HTTP/1.1 module downloads.')
            }
            await context.close()
          } finally {
            await browser.disconnect()
          }
          NODE
            kill "$preview_pid"
            wait "$preview_pid" || true
            preview_pid=''
          done
          exit "$failed"

      - name: Upload packet-delay results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: packet-delay-control
          path: /tmp/em-nodelay-*.json
          if-no-files-found: error
          retention-days: 7

      - name: Upload snapshot differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: __diff_output__
          path: src/e2e/puppeteer/__tests__/__image_snapshots__/**/__diff_output__/
          if-no-files-found: ignore
