name: Agent Scripts

# Integration tests for the agent-session scripts — the machinery Copilot agent sessions run on,
# which otherwise executes in no CI at all (copilot-setup-steps.yml launches it in every agent
# session but only triggers on changes to itself), so a break like #4848 (un-awaited
# executablePath() Promise passed to spawn) ships silently and takes down agent sessions:
#
#   - scripts/shared-chrome.test.mjs launches the real scripts/shared-chrome.mjs and asserts the
#     CDP endpoint answers with Chrome's actual handshake.
#   - scripts/bridge-attach.test.ts attaches to that Chrome through the real web executor bridge
#     (src/e2e/puppeteer/attachExistingBrowserInstance.ts) via `npx tsx`, the same invocation the
#     browser-control-chrome skill documents for agents.
#   - scripts/mcp-session-proxy.test.mjs runs the real scripts/mcp-session-proxy.mjs against a
#     local stub upstream and asserts session adoption, DELETE swallowing, and clean forwarding —
#     no BrowserStack credentials involved.
#   - .github/hooks/end-session.test.sh exercises the cloud-agent completion hook as a lifecycle
#     state machine: nested helpers pass, premature Worker Bee/parent stops block, and only the
#     current session's end-session marker allows completion.
#
# `paths` means a non-matching PR reports no check at all — not a skipped one — so this workflow
# must never be made a required status check on main (see § Path filtering in docs/testing.md).
on:
  push:
    branches:
      - main
    paths:
      - scripts/shared-chrome.mjs
      - scripts/shared-chrome.test.mjs
      - scripts/mcp-session-proxy.mjs
      - scripts/mcp-session-proxy.test.mjs
      - scripts/bridge-attach.test.ts
      - .github/hooks/end-session.json
      - .github/hooks/end-session.sh
      - .github/hooks/end-session.test.sh
      - .github/skills/end-session/SKILL.md
      - src/e2e/puppeteer/attachExistingBrowserInstance.ts
      - src/e2e/puppeteer/session.ts
      - .github/workflows/agent-scripts.yml
      # A puppeteer bump is exactly the #4848 vector: executablePath() went async with a version
      # change. Any dependency change materializes here, and the job is cheap.
      - yarn.lock
  pull_request:
    branches:
      - '**'
    # GitHub Actions does not support YAML anchors, so this list is duplicated from `push` above.
    paths:
      - scripts/shared-chrome.mjs
      - scripts/shared-chrome.test.mjs
      - scripts/mcp-session-proxy.mjs
      - scripts/mcp-session-proxy.test.mjs
      - scripts/bridge-attach.test.ts
      - .github/hooks/end-session.json
      - .github/hooks/end-session.sh
      - .github/hooks/end-session.test.sh
      - .github/skills/end-session/SKILL.md
      - src/e2e/puppeteer/attachExistingBrowserInstance.ts
      - src/e2e/puppeteer/session.ts
      - .github/workflows/agent-scripts.yml
      - yarn.lock
  workflow_dispatch:

# Supersede the in-progress run when a pull request is pushed again; its result is about to be
# replaced anyway. Only pull_request runs are grouped: `github.ref` is `refs/pull/<n>/merge` there,
# so it is already per-PR. Every other event falls back to github.run_id, which is unique per run
# and therefore never collides. (See the identical block in lint.yml for the full rationale.)
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true
  # Chrome-for-Testing download hosts, needed because this job — unlike every other workflow, which
  # sets PUPPETEER_SKIP_DOWNLOAD — deliberately lets puppeteer's postinstall download its managed
  # Chrome: launching that browser is the behavior under test.
  COPILOT_AGENT_FIREWALL_ALLOW_LIST_ADDITIONS: googlechromelabs.github.io,storage.googleapis.com

jobs:
  run:
    name: Agent Scripts
    runs-on: ubuntu-latest

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Run cloud agent completion guard integration test
        run: bash .github/hooks/end-session.test.sh

      - name: Enable Corepack
        run: corepack enable

      - name: Set Node.js version
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'

      # Plain `yarn` rather than ./.github/actions/install: the composite action restores
      # node_modules from cache, and on a hit yarn skips dependency postinstalls — including
      # puppeteer's Chrome download — leaving no browser for the script to launch. Plain `yarn` is
      # also exactly how copilot-setup-steps.yml installs, so this job exercises the same
      # environment the scripts actually run in.
      - name: Install npm dependencies
        run: yarn

      # First: it is the fastest and needs no browser, so a proxy break fails the run in seconds.
      - name: Run MCP session proxy integration test
        run: node scripts/mcp-session-proxy.test.mjs

      - name: Run shared Chrome integration test
        run: node scripts/shared-chrome.test.mjs

      - name: Run web bridge attach integration test
        run: npx tsx scripts/bridge-attach.test.ts
