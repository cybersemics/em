name: TDD

on:
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      rerun_id:
        description: 'Optional ID for tracking repeated runs'
        required: false

# Supersede the in-progress run when a pull request is pushed again; its result is about to be
# replaced anyway. Only pull_request runs are grouped: `github.ref` is `refs/pull/<n>/merge` there,
# so it is already per-PR. (vercel-preview.yml must key on the PR number instead because
# pull_request_target sets github.ref to the base branch.)
#
# workflow_dispatch falls back to github.run_id, which is unique per run and therefore never
# collides. That is deliberate, and not the same as cancel-in-progress: false — a shared group with
# cancellation off *queues* runs, and GitHub cancels a pending run when a newer one queues behind
# it, which would break the `ghworkflow` flake hunt (docs/testing.md § Triggering GitHub Actions
# workflows manually) that fans out many runs on one ref.
#
# The iOS job is in tdd-ios.yml, which runs under pull_request_target so that fork pull requests get
# the BrowserStack credentials, and keys its own group on the pull request number.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true
  COPILOT_AGENT_FIREWALL_ALLOW_LIST_ADDITIONS: googlechromelabs.github.io,storage.googleapis.com
  # Skip Puppeteer's Chrome download on install — none of this workflow's jobs uses the bundled
  # browser (Puppeteer tests attach to the browserless/chromium service via CDP; only
  # agent-scripts.yml launches the bundled browser), saving ~20s per install.
  PUPPETEER_SKIP_DOWNLOAD: true

jobs:
  # ---------------------------------------------------------------------------
  # Detect: classify changed files, decide which downstream jobs to run.
  # ---------------------------------------------------------------------------
  detect:
    name: Detect changed tests
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.changed_files > 0
    outputs:
      has_unit: ${{ steps.detect.outputs.has_unit }}
      has_puppeteer: ${{ steps.detect.outputs.has_puppeteer }}
      has_skipped_unit: ${{ steps.detect.outputs.has_skipped_unit }}
      has_skipped_puppeteer: ${{ steps.detect.outputs.has_skipped_puppeteer }}
      unit_files: ${{ steps.detect.outputs.unit_files }}
      puppeteer_files: ${{ steps.detect.outputs.puppeteer_files }}
      helper_files: ${{ steps.detect.outputs.helper_files }}
      skipped_unit_files: ${{ steps.detect.outputs.skipped_unit_files }}
      skipped_puppeteer_files: ${{ steps.detect.outputs.skipped_puppeteer_files }}
      merge_base: ${{ steps.detect.outputs.merge_base }}
      tdd_commit: ${{ steps.detect.outputs.tdd_commit }}
      skip: ${{ steps.detect.outputs.skip }}
      skip_reason: ${{ steps.detect.outputs.reason }}
      skip_unit: ${{ steps.detect.outputs.skip_unit }}
      skip_puppeteer: ${{ steps.detect.outputs.skip_puppeteer }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 999

      # Shared with tdd-ios.yml, which runs the iOS job under pull_request_target.
      - name: Detect changed tests
        id: detect
        uses: ./.github/actions/tdd-detect

  # ---------------------------------------------------------------------------
  # Unit: apply changed unit test diff to base, run them, expect failure.
  # ---------------------------------------------------------------------------
  unit:
    name: TDD — Unit tests
    needs: detect
    if: needs.detect.outputs.skip != 'true' && needs.detect.outputs.skip_unit != 'true' && needs.detect.outputs.has_unit == 'true'
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.run_tests.outputs.verdict }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect.outputs.tdd_commit }}
          fetch-depth: 999

      # The verdict script comes from the commit this workflow file was read from, so that the two always agree. The
      # tree checked out above is the pre-fix commit, which may predate the script. Fetched before the PR head, since
      # the steps below read the head from FETCH_HEAD.
      - name: Check out the verdict script with the workflow
        run: |
          git fetch --depth=1 origin ${{ github.sha }}
          git checkout ${{ github.sha }} -- scripts/ci/tdd-verdict.mjs

      - name: Fetch PR head
        run: git fetch origin ${{ github.event.pull_request.head.sha }}

      - name: Restore GitHub Actions files from PR HEAD
        if: github.event_name == 'pull_request'
        run: git checkout FETCH_HEAD -- .github/actions/ .github/scripts/

      - name: Checkout test files from PR head
        id: patch
        run: |
          # Decode the file list
          UNIT_FILES=$(echo "${{ needs.detect.outputs.unit_files }}" | base64 -d)

          echo "=== Changed unit test files ==="
          echo "$UNIT_FILES"

          if [ -z "$UNIT_FILES" ]; then
            echo "No unit test files to process"
            echo "empty=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check out a path from the PR head, or delete it when the PR deleted it. git checkout fails outright on a
          # pathspec that does not exist at the target, so a PR that removes a test or a helper would break the run
          # here. A deletion is part of the change under test like any other edit, so base has to reflect it too.
          sync_from_head() {
            local f="$1"
            if git cat-file -e "FETCH_HEAD:$f" 2>/dev/null; then
              echo "Checking out: $f"
              git checkout FETCH_HEAD -- "$f"
            else
              echo "Removing (deleted in PR): $f"
              git rm -q --ignore-unmatch -- "$f"
            fi
          }

          # Check out each test file directly from the PR head. This reliably handles
          # both modified files and brand-new test files (including new directories),
          # where git apply --3way can fail because there is no base blob to merge.
          echo "=== Checking out test files from PR head ==="
          for f in $UNIT_FILES; do
            sync_from_head "$f"
          done

          # Test infrastructure the changed tests may depend on, e.g. a new helper.
          HELPER_FILES=$(echo "${{ needs.detect.outputs.helper_files }}" | base64 -d)
          for f in $HELPER_FILES; do
            sync_from_head "$f"
          done

          echo "empty=false" >> "$GITHUB_OUTPUT"

      - name: Enable Corepack
        if: steps.patch.outputs.empty != 'true'
        run: corepack enable

      - name: Unskip added unit tests before running on base
        if: steps.patch.outputs.empty != 'true' && needs.detect.outputs.has_skipped_unit == 'true'
        uses: ./.github/actions/unskip-added-tests
        with:
          merge-base: ${{ needs.detect.outputs.merge_base }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          skipped-files: ${{ needs.detect.outputs.skipped_unit_files }}
          no-files-message: No unit skipped test files to unskip.

      - name: Set Node.js version
        if: steps.patch.outputs.empty != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install npm dependencies
        if: steps.patch.outputs.empty != 'true'
        uses: ./.github/actions/install

      - name: Run changed unit tests on base (expect failure)
        if: steps.patch.outputs.empty != 'true'
        id: run_tests
        run: |
          UNIT_FILES=$(echo "${{ needs.detect.outputs.unit_files }}" | base64 -d)

          echo "=== Running changed unit tests ==="
          echo "$UNIT_FILES"

          # Run only the changed test files
          # vitest accepts file paths as positional args
          set +e
          yarn vitest run --project unit $UNIT_FILES --reporter=default --reporter=json --outputFile.json=/tmp/tdd-results.json 2>&1
          TEST_EXIT=$?
          echo ""
          node scripts/ci/tdd-verdict.mjs vitest /tmp/tdd-results.json "$TEST_EXIT"
          VERDICT_EXIT=$?
          set -e

          # A nonzero exit is not evidence on its own: the verdict is read from the tests the runner reports.
          case "$VERDICT_EXIT" in
            0) VERDICT=validated ;;
            10) VERDICT=flagged ;;
            *) VERDICT=invalid ;;
          esac
          echo "test_exit=$TEST_EXIT" >> "$GITHUB_OUTPUT"
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"

          if [ "$VERDICT" = validated ]; then
            echo "✅ TDD validated: changed tests FAIL on the base branch."
            echo "This means the tests are genuinely covering new behavior."
          elif [ "$VERDICT" = flagged ]; then
            echo "❌ TDD flagged: changed tests PASS on the base branch."
            echo "New tests that accompany bug fixes are expected to FAIL on the base branch and PASS on the PR, demonstrating that the issue has been fixed. Please review your tests and make sure they fail on the base branch."
            echo "If you are extending the test coverage over previously working behavior, add the 'skip-tdd' or 'skip-tdd-unit' label to the PR to skip this workflow."

            # Emit GitHub diff annotations for each added it()/test() call so the
            # TDD violation is highlighted directly in the PR file changes view.
            git diff "${{ needs.detect.outputs.merge_base }}" "${{ github.event.pull_request.head.sha }}" -- $UNIT_FILES > /tmp/test.patch
            sh .github/scripts/annotate-tdd-violations.sh /tmp/test.patch

            exit 1
          else
            echo "❌ TDD not validated: the changed tests did not run to a result on the base branch (exit code $TEST_EXIT)."
            echo "A configuration error, a file that fails to load, or a run with no tests proves nothing about the fix. See the output above."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Puppeteer: apply changed puppeteer test diff to base, run them, expect failure.
  # ---------------------------------------------------------------------------
  puppeteer:
    name: TDD — Puppeteer tests
    needs: detect
    if: needs.detect.outputs.skip != 'true' && needs.detect.outputs.skip_puppeteer != 'true' && needs.detect.outputs.has_puppeteer == 'true'
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.run_tests.outputs.verdict }}
    services:
      browserless:
        image: ghcr.io/browserless/chromium:v2.56.2
        ports:
          - 7566:3000
        env:
          TIMEOUT: 0

    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect.outputs.tdd_commit }}
          fetch-depth: 999

      # The verdict script comes from the commit this workflow file was read from, so that the two always agree. The
      # tree checked out above is the pre-fix commit, which may predate the script. Fetched before the PR head, since
      # the steps below read the head from FETCH_HEAD.
      - name: Check out the verdict script with the workflow
        run: |
          git fetch --depth=1 origin ${{ github.sha }}
          git checkout ${{ github.sha }} -- scripts/ci/tdd-verdict.mjs

      - name: Fetch PR head
        run: git fetch origin ${{ github.event.pull_request.head.sha }}

      - name: Restore test infrastructure from PR HEAD
        if: github.event_name == 'pull_request'
        run: git checkout FETCH_HEAD -- .github/actions/ .github/scripts/ src/e2e/puppeteer/install-browserless-fonts.sh

      - name: Checkout test files and support from PR head
        id: patch
        run: |
          PUPPETEER_FILES=$(echo "${{ needs.detect.outputs.puppeteer_files }}" | base64 -d)
          PUPPETEER_SUPPORT_FILES=$(git diff --name-only "${{ needs.detect.outputs.merge_base }}" FETCH_HEAD -- \
            | grep -E '^src/e2e/(browserEnvironment|puppeteer)/(helpers|config|setup)/' || true)

          echo "=== Changed puppeteer test files ==="
          echo "$PUPPETEER_FILES"
          echo "=== Changed puppeteer test support files ==="
          echo "$PUPPETEER_SUPPORT_FILES"

          if [ -z "$PUPPETEER_FILES" ]; then
            echo "No puppeteer test files to process"
            echo "empty=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check out a path from the PR head, or delete it when the PR deleted it. git checkout fails outright on a
          # pathspec that does not exist at the target, so a PR that removes a test or a helper would break the run
          # here. A deletion is part of the change under test like any other edit, so base has to reflect it too.
          sync_from_head() {
            local f="$1"
            if git cat-file -e "FETCH_HEAD:$f" 2>/dev/null; then
              echo "Checking out: $f"
              git checkout FETCH_HEAD -- "$f"
            else
              echo "Removing (deleted in PR): $f"
              git rm -q --ignore-unmatch -- "$f"
            fi
          }

          # Test support is part of the test, not the application fix. Check it out
          # with the test so the base-branch run reaches the behavioral assertion.
          echo "=== Checking out puppeteer test files and support from PR head ==="
          for f in $PUPPETEER_FILES $PUPPETEER_SUPPORT_FILES; do
            sync_from_head "$f"
          done

          # Test infrastructure the changed tests may depend on, e.g. a new helper.
          HELPER_FILES=$(echo "${{ needs.detect.outputs.helper_files }}" | base64 -d)
          for f in $HELPER_FILES; do
            sync_from_head "$f"
          done

          echo "empty=false" >> "$GITHUB_OUTPUT"

      - name: Install Microsoft Core Fonts
        if: steps.patch.outputs.empty != 'true'
        run: ./src/e2e/puppeteer/install-browserless-fonts.sh '${{ job.services.browserless.id }}'

      - name: Enable Corepack
        if: steps.patch.outputs.empty != 'true'
        run: corepack enable

      - name: Unskip added puppeteer tests before running on base
        if: steps.patch.outputs.empty != 'true' && needs.detect.outputs.has_skipped_puppeteer == 'true'
        uses: ./.github/actions/unskip-added-tests
        with:
          merge-base: ${{ needs.detect.outputs.merge_base }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          skipped-files: ${{ needs.detect.outputs.skipped_puppeteer_files }}
          no-files-message: No puppeteer skipped test files to unskip.

      - name: Set Node.js version
        if: steps.patch.outputs.empty != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install npm dependencies
        if: steps.patch.outputs.empty != 'true'
        uses: ./.github/actions/install

      - name: Start SSL proxy
        if: steps.patch.outputs.empty != 'true'
        run: docker run -d --rm --add-host=host.docker.internal:host-gateway -e "PORT=3000" -p 2552:443 esplo/docker-local-ssl-termination-proxy

      - name: Build
        if: steps.patch.outputs.empty != 'true'
        run: yarn build

      - name: Serve
        if: steps.patch.outputs.empty != 'true'
        uses: ./.github/actions/serve

      - name: Run changed puppeteer tests on base (expect failure)
        if: steps.patch.outputs.empty != 'true'
        id: run_tests
        run: |
          PUPPETEER_FILES=$(echo "${{ needs.detect.outputs.puppeteer_files }}" | base64 -d)

          echo "=== Running changed puppeteer tests ==="
          echo "$PUPPETEER_FILES"

          set +e
          yarn vitest run --project puppeteer-e2e $PUPPETEER_FILES --reporter=default --reporter=json --outputFile.json=/tmp/tdd-results.json 2>&1
          TEST_EXIT=$?
          echo ""
          node scripts/ci/tdd-verdict.mjs vitest /tmp/tdd-results.json "$TEST_EXIT"
          VERDICT_EXIT=$?
          set -e

          # A nonzero exit is not evidence on its own: the verdict is read from the tests the runner reports.
          case "$VERDICT_EXIT" in
            0) VERDICT=validated ;;
            10) VERDICT=flagged ;;
            *) VERDICT=invalid ;;
          esac
          echo "test_exit=$TEST_EXIT" >> "$GITHUB_OUTPUT"
          echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"

          if [ "$VERDICT" = validated ]; then
            echo "✅ TDD validated: changed puppeteer tests FAIL on the base branch."
            echo "This means the tests are genuinely covering new behavior."
          elif [ "$VERDICT" = flagged ]; then
            echo "❌ TDD flagged: changed puppeteer tests PASS on the base branch."
            echo "New tests that accompany bug fixes are expected to FAIL on the base branch and PASS on the PR, demonstrating that the issue has been fixed. Please review your tests and make sure they fail on the base branch."
            echo "If you are extending the test coverage over previously working behavior, add the 'skip-tdd' or 'skip-tdd-puppeteer' label to the PR to skip this workflow."

            # Emit GitHub diff annotations for each added it()/test() call so the
            # TDD violation is highlighted directly in the PR file changes view.
            git diff "${{ needs.detect.outputs.merge_base }}" "${{ github.event.pull_request.head.sha }}" -- $PUPPETEER_FILES > /tmp/test.patch
            sh .github/scripts/annotate-tdd-violations.sh /tmp/test.patch

            exit 1
          else
            echo "❌ TDD not validated: the changed puppeteer tests did not run to a result on the base branch (exit code $TEST_EXIT)."
            echo "A configuration error, a file that fails to load, or a run with no tests proves nothing about the fix. See the output above."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Summary: single status check that downstream branch protection can require.
  # ---------------------------------------------------------------------------
  summary:
    name: TDD
    runs-on: ubuntu-latest
    if: always()
    needs: [detect, unit, puppeteer]
    steps:
      - name: Evaluate results
        run: |
          DETECT_RESULT="${{ needs.detect.result }}"
          SKIP="${{ needs.detect.outputs.skip }}"
          SKIP_REASON="${{ needs.detect.outputs.skip_reason }}"
          SKIP_UNIT="${{ needs.detect.outputs.skip_unit }}"
          SKIP_PUPPETEER="${{ needs.detect.outputs.skip_puppeteer }}"

          echo "=== TDD Validation Summary ==="

          if [ "$DETECT_RESULT" = "skipped" ]; then
            echo "⏭️  Skipped: No file changes"
            exit 0
          fi

          if [ "$SKIP" = "true" ]; then
            echo "⏭️  Skipped: $SKIP_REASON"
            exit 0
          fi

          if [ -n "$SKIP_REASON" ]; then
            echo "⏭️  Partial skip: $SKIP_REASON"
          fi

          # Check each job result
          UNIT_RESULT="${{ needs.unit.result }}"
          PUPPETEER_RESULT="${{ needs.puppeteer.result }}"

          echo "Unit:      $UNIT_RESULT ${{ needs.unit.outputs.verdict }}"
          echo "Puppeteer: $PUPPETEER_RESULT ${{ needs.puppeteer.outputs.verdict }}"
          echo "iOS:       see the TDD iOS workflow"
          echo ""

          FAILED="false"

          # A job result of "success" means the tests ran and failed on base (TDD validated), and "skipped" means
          # no changed tests of that type. A "failure" is one of two things, told apart by the job's verdict:
          # "flagged" means the tests passed on base; anything else means they never ran to a result, whether the
          # runner reported none or an earlier step (checkout, install, build) failed before they could run.
          report() {
            local name="$1" result="$2" verdict="$3"
            [ "$result" = "failure" ] || return 0
            FAILED="true"
            if [ "$verdict" = "flagged" ]; then
              echo "❌ $name tests passed on base branch — TDD flagged"
            else
              echo "❌ $name tests did not run to a result on base branch — TDD not validated"
            fi
          }
          report Unit "$UNIT_RESULT" "${{ needs.unit.outputs.verdict }}"
          report Puppeteer "$PUPPETEER_RESULT" "${{ needs.puppeteer.outputs.verdict }}"

          if [ "$FAILED" = "true" ]; then
            echo ""
            echo "TDD validation failed. Changed tests should run and fail on the base branch"
            echo "to prove they cover new functionality. If they pass there intentionally, add the"
            echo "'skip-tdd' label to skip all TDD checks, or use 'skip-tdd-unit' /"
            echo "'skip-tdd-puppeteer' to skip only the relevant job. A run that did not reach"
            echo "a result has to be fixed instead; see the job's log."
            exit 1
          fi

          echo "✅ TDD validation passed!"
