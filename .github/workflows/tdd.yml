name: TDD

# Triggers on pull_request_target, not pull_request, because the iOS job needs the BROWSERSTACK_*
# secrets and a pull_request run from a fork never receives them. Before this the job crashed loading
# its config on every fork PR, and the workflow counted the crash as proof the tests fail (#4744).
# ios.yml makes the same trade for the same reason.
#
# What that changes:
#   - The workflow file is read from the base branch, so an edit to it takes effect only once merged.
#   - No pull request code is ever the workspace. Each job checks out the base commit and copies in
#     only the changed test files and the test support they depend on, and the CI scaffolding
#     (.github/actions, .github/scripts) is restored from the commit this file was read from, never
#     from the pull request.
#   - GitHub's approval gate for first-time contributors does not apply to this trigger. The iOS test
#     step runs the pull request's test files with the BrowserStack secrets in its environment, which
#     is the same exposure ios.yml already accepts.
#   - The run reports on conflicting pull requests too, since there is no merge ref to build.
on:
  pull_request_target:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      rerun_id:
        description: 'Optional ID for tracking repeated runs'
        required: false

# Supersede the in-progress run when a pull request is pushed again; its result is about to be
# replaced anyway. Keyed on the PR number rather than github.ref because pull_request_target sets
# github.ref to the base branch — every open PR against main would otherwise share one group and
# cancel each other (evals.yml and vercel-preview.yml do the same).
#
# workflow_dispatch falls back to github.run_id, which is unique per run and therefore never
# collides. That is deliberate, and not the same as cancel-in-progress: false — a shared group with
# cancellation off *queues* runs, and GitHub cancels a pending run when a newer one queues behind
# it, which would break the `ghworkflow` flake hunt (docs/testing.md § Triggering GitHub Actions
# workflows manually) that fans out many runs on one ref.
#
# This group is separate from ios.yml's per-PR one, so the two workflows never queue behind each
# other; both wait in-process for real BrowserStack session headroom instead (see
# waitForBrowserStackSlots.ts), and cancelling a superseded run only ever reduces the draw on that
# shared pool.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  CI: true
  COPILOT_AGENT_FIREWALL_ALLOW_LIST_ADDITIONS: googlechromelabs.github.io,storage.googleapis.com
  # Skip Puppeteer's Chrome download on install — none of this workflow's jobs uses the bundled
  # browser (Puppeteer tests attach to the browserless/chromium service via CDP; only
  # agent-scripts.yml launches the bundled browser), saving ~20s per install.
  PUPPETEER_SKIP_DOWNLOAD: true

jobs:
  # ---------------------------------------------------------------------------
  # Detect: classify changed files, decide which downstream jobs to run.
  # ---------------------------------------------------------------------------
  detect:
    name: Detect changed tests
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request_target' || github.event.pull_request.changed_files > 0
    outputs:
      has_unit: ${{ steps.classify.outputs.has_unit }}
      ios_credentials: ${{ steps.credentials.outputs.available }}
      has_puppeteer: ${{ steps.classify.outputs.has_puppeteer }}
      has_ios: ${{ steps.classify.outputs.has_ios }}
      has_skipped_unit: ${{ steps.classify.outputs.has_skipped_unit }}
      has_skipped_puppeteer: ${{ steps.classify.outputs.has_skipped_puppeteer }}
      has_skipped_ios: ${{ steps.classify.outputs.has_skipped_ios }}
      unit_files: ${{ steps.classify.outputs.unit_files }}
      puppeteer_files: ${{ steps.classify.outputs.puppeteer_files }}
      ios_files: ${{ steps.classify.outputs.ios_files }}
      helper_files: ${{ steps.classify.outputs.helper_files }}
      skipped_unit_files: ${{ steps.classify.outputs.skipped_unit_files }}
      skipped_puppeteer_files: ${{ steps.classify.outputs.skipped_puppeteer_files }}
      skipped_ios_files: ${{ steps.classify.outputs.skipped_ios_files }}
      merge_base: ${{ steps.classify.outputs.merge_base }}
      tdd_commit: ${{ steps.tdd_commit.outputs.tdd_commit }}
      skip: ${{ steps.skip.outputs.skip }}
      skip_reason: ${{ steps.skip.outputs.reason }}
      skip_unit: ${{ steps.skip.outputs.skip_unit }}
      skip_puppeteer: ${{ steps.skip.outputs.skip_puppeteer }}
      skip_ios: ${{ steps.skip.outputs.skip_ios }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 999

      # pull_request_target checks out the base branch, which has none of the pull request's commits
      # (a pull_request run would have checked out a merge ref containing them). Classifying needs
      # both ends of the diff, and validating a /tdd commit needs the pull request's history.
      - name: Fetch PR commits
        if: github.event_name == 'pull_request_target'
        run: git fetch --no-tags origin ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }}

      - name: Classify changed files
        id: classify
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          echo "Base SHA: $BASE_SHA"
          echo "Head SHA: $HEAD_SHA"

          # Compute the merge base so we only diff files changed in this PR,
          # not files from other PRs merged into the base branch since the PR
          # was originally branched off.
          MERGE_BASE=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          echo "Merge base: $MERGE_BASE"

          # All changed files in the PR
          CHANGED_FILES=$(git diff --name-only "$MERGE_BASE" "$HEAD_SHA" --)

          echo "=== All changed files ==="
          echo "$CHANGED_FILES"

          # Classify test files into categories
          # Unit tests: any __tests__/**/*.ts EXCLUDING e2e directories
          UNIT_FILES=$(echo "$CHANGED_FILES" | grep -E '^src/.*/__tests__/.*\.ts$' | grep -v '^src/e2e/' || true)

          # Puppeteer tests: src/e2e/puppeteer/__tests__/*.ts
          PUPPETEER_FILES=$(echo "$CHANGED_FILES" | grep -E '^src/e2e/puppeteer/__tests__/.*\.ts$' || true)

          # iOS tests: src/e2e/iOS/__tests__/**/*.ts
          IOS_FILES=$(echo "$CHANGED_FILES" | grep -E '^src/e2e/iOS/__tests__/.*\.ts$' || true)

          # Filter a newline-separated list of test files to only those where the diff
          # adds new test definitions (new it() or test() calls). This prevents triggering
          # TDD for changes that only modify existing test internals (e.g. replacing
          # sleep() with waitUntil()). Matches both it(...) and test(...) regardless of
          # indentation. Usage: filter_new_tests "$FILES" "$MERGE_BASE" "$HEAD_SHA"
          filter_new_tests() {
            local files="$1" merge_base="$2" head_sha="$3" result=""
            for f in $files; do
              if git diff "$merge_base" "$head_sha" -- "$f" | grep -qE '^\+[ \t]*(it|test)\b'; then
                result="$result"$'\n'"$f"
              fi
            done
            echo "$result" | sed '/^$/d'
          }

          # Filter a newline-separated list of test files to those where the diff adds
          # new skipped test definitions (it.skip/test.skip). These need a special TDD
          # flow that unskips them on base before execution.
          # Usage: filter_added_skipped_tests "$FILES" "$MERGE_BASE" "$HEAD_SHA"
          filter_added_skipped_tests() {
            local files="$1" merge_base="$2" head_sha="$3" result=""
            for f in $files; do
              if git diff "$merge_base" "$head_sha" -- "$f" | grep -qE '^\+[ \t]*(it|test)\.skip\b'; then
                result="$result"$'\n'"$f"
              fi
            done
            echo "$result" | sed '/^$/d'
          }

          UNIT_SKIPPED_FILES=$(filter_added_skipped_tests "$UNIT_FILES" "$MERGE_BASE" "$HEAD_SHA")
          PUPPETEER_SKIPPED_FILES=$(filter_added_skipped_tests "$PUPPETEER_FILES" "$MERGE_BASE" "$HEAD_SHA")
          IOS_SKIPPED_FILES=$(filter_added_skipped_tests "$IOS_FILES" "$MERGE_BASE" "$HEAD_SHA")

          UNIT_FILES=$(filter_new_tests "$UNIT_FILES" "$MERGE_BASE" "$HEAD_SHA")
          PUPPETEER_FILES=$(filter_new_tests "$PUPPETEER_FILES" "$MERGE_BASE" "$HEAD_SHA")
          IOS_FILES=$(filter_new_tests "$IOS_FILES" "$MERGE_BASE" "$HEAD_SHA")

          # All test files (union of the above)
          ALL_TEST_FILES=$(printf '%s\n' "$UNIT_FILES" "$PUPPETEER_FILES" "$IOS_FILES" | sed '/^$/d' | sort -u)

          # Test infrastructure: helpers, config, setup, and shared e2e root files used
          # by the tests. These are checked out onto base alongside the test files, since
          # a test/support change cannot compile on base without its infrastructure.
          HELPER_FILES=$(echo "$CHANGED_FILES" \
            | grep -E '^src/test-helpers/.*\.tsx?$|^src/e2e/[^/]+\.tsx?$|^src/e2e/[^/]+/(helpers|config|setup)/.*\.tsx?$' || true)

          # Non-test application files: TypeScript source files that are not test files,
          # test helpers, or e2e infrastructure (helpers, config, setup).
          # Excludes non-source files (markdown, yaml, json, js, css, html) to focus
          # on actual application logic changes.
          NON_TEST_FILES=$(echo "$CHANGED_FILES" \
            | grep -v -E '(/__tests__/|/test-helpers/|/e2e/.*/(helpers|config|setup)/)' \
            | grep -v -E '(\.md$|\.yml$|\.json$|\.js$|\.css$|\.html$)' \
            | grep -E '\.(ts|tsx)$' || true)

          echo ""
          echo "=== Unit test files ==="
          echo "$UNIT_FILES"
          echo ""
          echo "=== Puppeteer test files ==="
          echo "$PUPPETEER_FILES"
          echo ""
          echo "=== iOS test files ==="
          echo "$IOS_FILES"
          echo ""
          echo "=== Unit files with added skipped tests ==="
          echo "$UNIT_SKIPPED_FILES"
          echo ""
          echo "=== Puppeteer files with added skipped tests ==="
          echo "$PUPPETEER_SKIPPED_FILES"
          echo ""
          echo "=== Non-test application files ==="
          echo "$NON_TEST_FILES"
          echo ""
          echo "=== Test infrastructure files ==="
          echo "$HELPER_FILES"

          # Set outputs
          HAS_UNIT="false"
          HAS_PUPPETEER="false"
          HAS_IOS="false"
          HAS_SKIPPED_UNIT="false"
          HAS_SKIPPED_PUPPETEER="false"
          HAS_SKIPPED_IOS="false"

          if [ -n "$UNIT_FILES" ]; then HAS_UNIT="true"; fi
          if [ -n "$PUPPETEER_FILES" ]; then HAS_PUPPETEER="true"; fi
          if [ -n "$IOS_FILES" ]; then HAS_IOS="true"; fi
          if [ -n "$UNIT_SKIPPED_FILES" ]; then HAS_SKIPPED_UNIT="true"; fi
          if [ -n "$PUPPETEER_SKIPPED_FILES" ]; then HAS_SKIPPED_PUPPETEER="true"; fi
          if [ -n "$IOS_SKIPPED_FILES" ]; then HAS_SKIPPED_IOS="true"; fi

          echo "has_unit=$HAS_UNIT" >> "$GITHUB_OUTPUT"
          echo "has_puppeteer=$HAS_PUPPETEER" >> "$GITHUB_OUTPUT"
          echo "has_ios=$HAS_IOS" >> "$GITHUB_OUTPUT"
          echo "has_skipped_unit=$HAS_SKIPPED_UNIT" >> "$GITHUB_OUTPUT"
          echo "has_skipped_puppeteer=$HAS_SKIPPED_PUPPETEER" >> "$GITHUB_OUTPUT"
          echo "has_skipped_ios=$HAS_SKIPPED_IOS" >> "$GITHUB_OUTPUT"

          # Store file lists (newline-separated) for downstream jobs
          # Use base64 to safely pass through GITHUB_OUTPUT
          echo "unit_files=$(echo "$UNIT_FILES" | base64 -w 0)" >> "$GITHUB_OUTPUT"
          echo "puppeteer_files=$(echo "$PUPPETEER_FILES" | base64 -w 0)" >> "$GITHUB_OUTPUT"
          echo "ios_files=$(echo "$IOS_FILES" | base64 -w 0)" >> "$GITHUB_OUTPUT"
          echo "helper_files=$(echo "$HELPER_FILES" | base64 -w 0)" >> "$GITHUB_OUTPUT"
          echo "skipped_unit_files=$(echo "$UNIT_SKIPPED_FILES" | base64 -w 0)" >> "$GITHUB_OUTPUT"
          echo "skipped_puppeteer_files=$(echo "$PUPPETEER_SKIPPED_FILES" | base64 -w 0)" >> "$GITHUB_OUTPUT"
          echo "skipped_ios_files=$(echo "$IOS_SKIPPED_FILES" | base64 -w 0)" >> "$GITHUB_OUTPUT"
          echo "merge_base=$MERGE_BASE" >> "$GITHUB_OUTPUT"

          # Store whether any non-test app code changed
          HAS_APP_CHANGES="false"
          if [ -n "$NON_TEST_FILES" ]; then HAS_APP_CHANGES="true"; fi
          echo "has_app_changes=$HAS_APP_CHANGES" >> "$GITHUB_OUTPUT"

          echo ""
          echo "=== Summary ==="
          echo "Has unit tests: $HAS_UNIT"
          echo "Has puppeteer tests: $HAS_PUPPETEER"
          echo "Has iOS tests: $HAS_IOS"
          echo "Has unit skipped tests: $HAS_SKIPPED_UNIT"
          echo "Has puppeteer skipped tests: $HAS_SKIPPED_PUPPETEER"
          echo "Has app code changes: $HAS_APP_CHANGES"

      - name: Parse /tdd command from PR description
        id: tdd_commit
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"

          # Look for /tdd <commit> at the beginning of a line (7–40 lowercase hex chars)
          TDD_COMMIT=$(printf '%s' "$PR_BODY" | grep -oP '^/tdd\s+\K[a-f0-9]{7,40}' | head -1 || true)

          if [ -n "$TDD_COMMIT" ]; then
            # Validate the commit exists in the repository
            if git cat-file -t "$TDD_COMMIT" >/dev/null 2>&1; then
              echo "Found /tdd command — using commit: $TDD_COMMIT"
              echo "tdd_commit=$TDD_COMMIT" >> "$GITHUB_OUTPUT"
            else
              echo "::warning::/tdd commit '$TDD_COMMIT' not found in repository — falling back to base SHA: $BASE_SHA"
              echo "tdd_commit=$BASE_SHA" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No /tdd command found — using base SHA: $BASE_SHA"
            echo "tdd_commit=$BASE_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Check skip conditions
        id: skip
        run: |
          HAS_UNIT="${{ steps.classify.outputs.has_unit }}"
          HAS_PUPPETEER="${{ steps.classify.outputs.has_puppeteer }}"
          HAS_IOS="${{ steps.classify.outputs.has_ios }}"
          HAS_APP_CHANGES="${{ steps.classify.outputs.has_app_changes }}"
          HAS_SKIPPED_UNIT="${{ steps.classify.outputs.has_skipped_unit }}"
          HAS_SKIPPED_PUPPETEER="${{ steps.classify.outputs.has_skipped_puppeteer }}"
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          SKIP="false"
          REASON=""
          SKIP_UNIT="false"
          SKIP_PUPPETEER="false"
          SKIP_IOS="false"

          # 1. Check for skip-tdd label
          LABELS='${{ toJSON(github.event.pull_request.labels.*.name) }}'
          if echo "$LABELS" | grep -q '"skip-tdd"'; then
            SKIP="true"
            REASON="PR has skip-tdd label"
          fi

          # 1b. Check for granular skip labels
          if echo "$LABELS" | grep -q '"skip-tdd-unit"'; then
            SKIP_UNIT="true"
            REASON="PR has skip-tdd-unit label"
          fi
          if echo "$LABELS" | grep -q '"skip-tdd-puppeteer"'; then
            SKIP_PUPPETEER="true"
            REASON="${REASON:+$REASON; }PR has skip-tdd-puppeteer label"
          fi
          if echo "$LABELS" | grep -q '"skip-tdd-ios"'; then
            SKIP_IOS="true"
            REASON="${REASON:+$REASON; }PR has skip-tdd-ios label"
          fi

          # 2. No changed tests at all
          if [ "$SKIP" = "false" ] && [ "$HAS_UNIT" = "false" ] && [ "$HAS_PUPPETEER" = "false" ] && [ "$HAS_IOS" = "false" ]; then
            SKIP="true"
            REASON="No changed test files detected"
          fi

          # 3. Only test files changed, no application code changed (coverage-only)
          # Keep running when skipped tests were added so they can be unskipped and
          # validated against base.
          if [ "$SKIP" = "false" ] \
            && [ "$HAS_APP_CHANGES" = "false" ] \
            && [ "$HAS_SKIPPED_UNIT" = "false" ] \
            && [ "$HAS_SKIPPED_PUPPETEER" = "false" ]; then
            SKIP="true"
            REASON="Only test files changed (no application code) — likely coverage-only"
          fi

          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "reason=$REASON" >> "$GITHUB_OUTPUT"
          echo "skip_unit=$SKIP_UNIT" >> "$GITHUB_OUTPUT"
          echo "skip_puppeteer=$SKIP_PUPPETEER" >> "$GITHUB_OUTPUT"
          echo "skip_ios=$SKIP_IOS" >> "$GITHUB_OUTPUT"

          echo "=== Skip decision ==="
          echo "Skip: $SKIP"
          echo "Reason: $REASON"
          echo "Skip unit: $SKIP_UNIT"
          echo "Skip puppeteer: $SKIP_PUPPETEER"
          echo "Skip ios: $SKIP_IOS"

      # Whether the iOS job can authenticate with BrowserStack. Decided here because a job-level `if`
      # cannot read secrets. Only their presence is compared; the values never reach this step. A run
      # has none when the event reads a different secret store (Dependabot) or the repository lacks
      # them, and the iOS job is skipped with a warning then rather than left to crash in its config.
      - name: Check BrowserStack credentials
        id: credentials
        env:
          AVAILABLE: ${{ secrets.BROWSERSTACK_USERNAME != '' && secrets.BROWSERSTACK_ACCESS_KEY != '' }}
          IOS_EXPECTED: ${{ steps.classify.outputs.has_ios == 'true' && steps.skip.outputs.skip != 'true' && steps.skip.outputs.skip_ios != 'true' }}
        run: |
          echo "available=$AVAILABLE" >> "$GITHUB_OUTPUT"

          if [ "$AVAILABLE" != "true" ] && [ "$IOS_EXPECTED" = "true" ]; then
            echo "::warning title=TDD iOS tests not validated::BrowserStack credentials are not available to this run, so the changed iOS tests were not run on the base branch. The iOS job is skipped, not passed."
          fi

  # ---------------------------------------------------------------------------
  # Unit: apply changed unit test diff to base, run them, expect failure.
  # ---------------------------------------------------------------------------
  unit:
    name: TDD — Unit tests
    needs: detect
    if: needs.detect.outputs.skip != 'true' && needs.detect.outputs.skip_unit != 'true' && needs.detect.outputs.has_unit == 'true'
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.run_tests.outputs.verdict }}

    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect.outputs.tdd_commit }}
          fetch-depth: 999

      # The scaffolding comes from the commit this workflow file was read from (the base branch), never
      # from the pull request: the base checkout above can predate it when /tdd selects an old commit,
      # and the pull request's copy is code from a fork. This runs before `Fetch PR head` because both
      # fetch into FETCH_HEAD, which the steps after that one read.
      - name: Restore GitHub Actions files from the workflow commit
        if: github.event_name == 'pull_request_target'
        run: |
          git fetch --no-tags origin ${{ github.sha }}
          git checkout ${{ github.sha }} -- .github/actions/ .github/scripts/

      - name: Fetch PR head
        run: git fetch origin ${{ github.event.pull_request.head.sha }}

      - name: Checkout test files from PR head
        id: patch
        run: |
          # Decode the file list
          UNIT_FILES=$(echo "${{ needs.detect.outputs.unit_files }}" | base64 -d)

          echo "=== Changed unit test files ==="
          echo "$UNIT_FILES"

          if [ -z "$UNIT_FILES" ]; then
            echo "No unit test files to process"
            echo "empty=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check out a path from the PR head, or delete it when the PR deleted it. git checkout fails outright on a
          # pathspec that does not exist at the target, so a PR that removes a test or a helper would break the run
          # here. A deletion is part of the change under test like any other edit, so base has to reflect it too.
          sync_from_head() {
            local f="$1"
            if git cat-file -e "FETCH_HEAD:$f" 2>/dev/null; then
              echo "Checking out: $f"
              git checkout FETCH_HEAD -- "$f"
            else
              echo "Removing (deleted in PR): $f"
              git rm -q --ignore-unmatch -- "$f"
            fi
          }

          # Check out each test file directly from the PR head. This reliably handles
          # both modified files and brand-new test files (including new directories),
          # where git apply --3way can fail because there is no base blob to merge.
          echo "=== Checking out test files from PR head ==="
          for f in $UNIT_FILES; do
            sync_from_head "$f"
          done

          # Test infrastructure the changed tests may depend on, e.g. a new helper.
          HELPER_FILES=$(echo "${{ needs.detect.outputs.helper_files }}" | base64 -d)
          for f in $HELPER_FILES; do
            sync_from_head "$f"
          done

          echo "empty=false" >> "$GITHUB_OUTPUT"

      - name: Enable Corepack
        if: steps.patch.outputs.empty != 'true'
        run: corepack enable

      - name: Unskip added unit tests before running on base
        if: steps.patch.outputs.empty != 'true' && needs.detect.outputs.has_skipped_unit == 'true'
        uses: ./.github/actions/unskip-added-tests
        with:
          merge-base: ${{ needs.detect.outputs.merge_base }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          skipped-files: ${{ needs.detect.outputs.skipped_unit_files }}
          no-files-message: No unit skipped test files to unskip.

      - name: Set Node.js version
        if: steps.patch.outputs.empty != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install npm dependencies
        if: steps.patch.outputs.empty != 'true'
        uses: ./.github/actions/install

      - name: Run changed unit tests on base (expect failure)
        if: steps.patch.outputs.empty != 'true'
        id: run_tests
        run: |
          UNIT_FILES=$(echo "${{ needs.detect.outputs.unit_files }}" | base64 -d)

          echo "=== Running changed unit tests ==="
          echo "$UNIT_FILES"

          # Run only the changed test files
          # vitest accepts file paths as positional args
          # The JSON report is what the verdict is read from: the exit code alone cannot tell a failing
          # test from a test file that would not load (#4744). The path is absolute because vitest
          # resolves a relative one against its root.
          REPORT="$RUNNER_TEMP/tdd-report.json"
          set +e
          yarn vitest run --project unit --reporter=default --reporter=json --outputFile.json="$REPORT" $UNIT_FILES 2>&1
          TEST_EXIT=$?
          node .github/scripts/tdd-verdict.cjs --runner vitest --exit-code "$TEST_EXIT" --report "$REPORT" --name unit --skip-label skip-tdd-unit
          VERDICT_EXIT=$?
          set -e

          echo "test_exit=$TEST_EXIT" >> "$GITHUB_OUTPUT"

          # Exit code 1 means the tests passed on base. Emit GitHub diff annotations for each added
          # it()/test() call so the TDD violation is highlighted directly in the PR file changes view.
          if [ "$VERDICT_EXIT" -eq 1 ]; then
            git diff "${{ needs.detect.outputs.merge_base }}" "${{ github.event.pull_request.head.sha }}" -- $UNIT_FILES > /tmp/test.patch
            sh .github/scripts/annotate-tdd-violations.sh /tmp/test.patch
          fi

          exit "$VERDICT_EXIT"

  # ---------------------------------------------------------------------------
  # Puppeteer: apply changed puppeteer test diff to base, run them, expect failure.
  # ---------------------------------------------------------------------------
  puppeteer:
    name: TDD — Puppeteer tests
    needs: detect
    if: needs.detect.outputs.skip != 'true' && needs.detect.outputs.skip_puppeteer != 'true' && needs.detect.outputs.has_puppeteer == 'true'
    runs-on: ubuntu-latest
    outputs:
      verdict: ${{ steps.run_tests.outputs.verdict }}
    services:
      browserless:
        image: ghcr.io/browserless/chromium:v2.56.2
        ports:
          - 7566:3000
        env:
          TIMEOUT: 0

    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect.outputs.tdd_commit }}
          fetch-depth: 999

      # See the unit job: scaffolding comes from the workflow commit, before `Fetch PR head`.
      - name: Restore test infrastructure from the workflow commit
        if: github.event_name == 'pull_request_target'
        run: |
          git fetch --no-tags origin ${{ github.sha }}
          git checkout ${{ github.sha }} -- .github/actions/ .github/scripts/ src/e2e/puppeteer/install-browserless-fonts.sh

      - name: Fetch PR head
        run: git fetch origin ${{ github.event.pull_request.head.sha }}

      - name: Checkout test files and support from PR head
        id: patch
        run: |
          PUPPETEER_FILES=$(echo "${{ needs.detect.outputs.puppeteer_files }}" | base64 -d)
          PUPPETEER_SUPPORT_FILES=$(git diff --name-only "${{ needs.detect.outputs.merge_base }}" FETCH_HEAD -- \
            | grep -E '^src/e2e/(browserEnvironment|puppeteer)/(helpers|config|setup)/' || true)

          echo "=== Changed puppeteer test files ==="
          echo "$PUPPETEER_FILES"
          echo "=== Changed puppeteer test support files ==="
          echo "$PUPPETEER_SUPPORT_FILES"

          if [ -z "$PUPPETEER_FILES" ]; then
            echo "No puppeteer test files to process"
            echo "empty=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check out a path from the PR head, or delete it when the PR deleted it. git checkout fails outright on a
          # pathspec that does not exist at the target, so a PR that removes a test or a helper would break the run
          # here. A deletion is part of the change under test like any other edit, so base has to reflect it too.
          sync_from_head() {
            local f="$1"
            if git cat-file -e "FETCH_HEAD:$f" 2>/dev/null; then
              echo "Checking out: $f"
              git checkout FETCH_HEAD -- "$f"
            else
              echo "Removing (deleted in PR): $f"
              git rm -q --ignore-unmatch -- "$f"
            fi
          }

          # Test support is part of the test, not the application fix. Check it out
          # with the test so the base-branch run reaches the behavioral assertion.
          echo "=== Checking out puppeteer test files and support from PR head ==="
          for f in $PUPPETEER_FILES $PUPPETEER_SUPPORT_FILES; do
            sync_from_head "$f"
          done

          # Test infrastructure the changed tests may depend on, e.g. a new helper.
          HELPER_FILES=$(echo "${{ needs.detect.outputs.helper_files }}" | base64 -d)
          for f in $HELPER_FILES; do
            sync_from_head "$f"
          done

          echo "empty=false" >> "$GITHUB_OUTPUT"

      - name: Install Microsoft Core Fonts
        if: steps.patch.outputs.empty != 'true'
        run: ./src/e2e/puppeteer/install-browserless-fonts.sh '${{ job.services.browserless.id }}'

      - name: Enable Corepack
        if: steps.patch.outputs.empty != 'true'
        run: corepack enable

      - name: Unskip added puppeteer tests before running on base
        if: steps.patch.outputs.empty != 'true' && needs.detect.outputs.has_skipped_puppeteer == 'true'
        uses: ./.github/actions/unskip-added-tests
        with:
          merge-base: ${{ needs.detect.outputs.merge_base }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          skipped-files: ${{ needs.detect.outputs.skipped_puppeteer_files }}
          no-files-message: No puppeteer skipped test files to unskip.

      - name: Set Node.js version
        if: steps.patch.outputs.empty != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install npm dependencies
        if: steps.patch.outputs.empty != 'true'
        uses: ./.github/actions/install

      - name: Start SSL proxy
        if: steps.patch.outputs.empty != 'true'
        run: docker run -d --rm --add-host=host.docker.internal:host-gateway -e "PORT=3000" -p 2552:443 esplo/docker-local-ssl-termination-proxy

      - name: Build
        if: steps.patch.outputs.empty != 'true'
        run: yarn build

      - name: Serve
        if: steps.patch.outputs.empty != 'true'
        uses: ./.github/actions/serve

      - name: Run changed puppeteer tests on base (expect failure)
        if: steps.patch.outputs.empty != 'true'
        id: run_tests
        run: |
          PUPPETEER_FILES=$(echo "${{ needs.detect.outputs.puppeteer_files }}" | base64 -d)

          echo "=== Running changed puppeteer tests ==="
          echo "$PUPPETEER_FILES"

          # The verdict is read from the JSON report rather than the exit code — see the unit job.
          REPORT="$RUNNER_TEMP/tdd-report.json"
          set +e
          yarn vitest run --project puppeteer-e2e --reporter=default --reporter=json --outputFile.json="$REPORT" $PUPPETEER_FILES 2>&1
          TEST_EXIT=$?
          node .github/scripts/tdd-verdict.cjs --runner vitest --exit-code "$TEST_EXIT" --report "$REPORT" --name puppeteer --skip-label skip-tdd-puppeteer
          VERDICT_EXIT=$?
          set -e

          echo "test_exit=$TEST_EXIT" >> "$GITHUB_OUTPUT"

          # Exit code 1 means the tests passed on base. Emit GitHub diff annotations for each added
          # it()/test() call so the TDD violation is highlighted directly in the PR file changes view.
          if [ "$VERDICT_EXIT" -eq 1 ]; then
            git diff "${{ needs.detect.outputs.merge_base }}" "${{ github.event.pull_request.head.sha }}" -- $PUPPETEER_FILES > /tmp/test.patch
            sh .github/scripts/annotate-tdd-violations.sh /tmp/test.patch
          fi

          exit "$VERDICT_EXIT"

  # ---------------------------------------------------------------------------
  # iOS BrowserStack: check out the changed iOS test diff onto base, run on
  # BrowserStack, expect failure. Real device time — gate independently with the
  # `skip-tdd-ios` label. Requires the BROWSERSTACK_* secrets, which this workflow's
  # pull_request_target trigger gives fork PRs. When a run has none (Dependabot), `detect`
  # leaves this job skipped and warns, rather than letting it crash in the wdio config.
  # ---------------------------------------------------------------------------
  ios:
    name: TDD — iOS tests
    needs: detect
    if: needs.detect.outputs.skip != 'true' && needs.detect.outputs.skip_ios != 'true' && needs.detect.outputs.has_ios == 'true' && needs.detect.outputs.ios_credentials == 'true'
    runs-on: ubuntu-latest
    # pull_request_target gives the token write access by default, and this job runs the pull
    # request's test files with secrets in the environment. Nothing here needs more than a checkout.
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.run_tests.outputs.verdict }}
    env:
      # Activates the console proxy (src/util/consoleProxy.ts) at build time; BrowserStack can't access
      # iOS console logs, and the wdio config's beforeTest waits for the proxy. Mirrors ios.yml.
      VITE_BROWSER_CONSOLE_CAPTURE: 1

    steps:
      - name: Clone repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.detect.outputs.tdd_commit }}
          fetch-depth: 999

      # See the unit job: scaffolding comes from the workflow commit, before `Fetch PR head`.
      - name: Restore GitHub Actions files from the workflow commit
        if: github.event_name == 'pull_request_target'
        run: |
          git fetch --no-tags origin ${{ github.sha }}
          git checkout ${{ github.sha }} -- .github/actions/ .github/scripts/

      - name: Fetch PR head
        run: git fetch origin ${{ github.event.pull_request.head.sha }}

      - name: Checkout test files and support from PR head
        id: patch
        run: |
          IOS_FILES=$(echo "${{ needs.detect.outputs.ios_files }}" | base64 -d)
          IOS_SUPPORT_FILES=$(git diff --name-only "${{ needs.detect.outputs.merge_base }}" FETCH_HEAD -- \
            | grep -E '^src/e2e/(browserEnvironment|iOS)/(helpers|config|setup)/' || true)

          echo "=== Changed iOS test files ==="
          echo "$IOS_FILES"
          echo "=== Changed iOS test support files ==="
          echo "$IOS_SUPPORT_FILES"

          if [ -z "$IOS_FILES" ]; then
            echo "No iOS test files to process"
            echo "empty=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Check out a path from the PR head, or delete it when the PR deleted it. git checkout fails outright on a
          # pathspec that does not exist at the target, so a PR that removes a test or a helper would break the run
          # here. A deletion is part of the change under test like any other edit, so base has to reflect it too.
          sync_from_head() {
            local f="$1"
            if git cat-file -e "FETCH_HEAD:$f" 2>/dev/null; then
              echo "Checking out: $f"
              git checkout FETCH_HEAD -- "$f"
            else
              echo "Removing (deleted in PR): $f"
              git rm -q --ignore-unmatch -- "$f"
            fi
          }

          # Test support is part of the test, not the application fix. Check it out
          # with the test so the base-branch run reaches the behavioral assertion.
          echo "=== Checking out iOS test files and support from PR head ==="
          for f in $IOS_FILES $IOS_SUPPORT_FILES; do
            sync_from_head "$f"
          done

          # Test infrastructure the changed tests may depend on, e.g. a new helper.
          HELPER_FILES=$(echo "${{ needs.detect.outputs.helper_files }}" | base64 -d)
          for f in $HELPER_FILES; do
            sync_from_head "$f"
          done

          echo "empty=false" >> "$GITHUB_OUTPUT"

      - name: Enable Corepack
        if: steps.patch.outputs.empty != 'true'
        run: corepack enable

      - name: Unskip added iOS tests before running on base
        if: steps.patch.outputs.empty != 'true' && needs.detect.outputs.has_skipped_ios == 'true'
        uses: ./.github/actions/unskip-added-tests
        with:
          merge-base: ${{ needs.detect.outputs.merge_base }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          skipped-files: ${{ needs.detect.outputs.skipped_ios_files }}
          no-files-message: No iOS skipped test files to unskip.

      - name: Set Node.js version
        if: steps.patch.outputs.empty != 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: 'yarn'

      - name: Install npm dependencies
        if: steps.patch.outputs.empty != 'true'
        uses: ./.github/actions/install

      - name: Build
        if: steps.patch.outputs.empty != 'true'
        run: yarn build

      # Vite app-gate token (see tunnelTokenGate in vite.config.ts). Must be set before Serve
      # starts the dev server, and passed to the test step below so the wdio config's tunnel-pool
      # claim (cloudflareTunnelPool.ts) can prove a candidate is answering THIS run's server.
      - name: Generate tunnel token
        if: steps.patch.outputs.empty != 'true'
        run: |
          TOKEN=$(openssl rand -hex 16)
          echo "::add-mask::$TOKEN"
          echo "TUNNEL_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Serve
        if: steps.patch.outputs.empty != 'true'
        # HTTP=1 forces a plain-HTTP origin here: Cloudflare's tunnel already terminates HTTPS at its edge for Safari (a real CA-signed cert on the public hostname), so this local connector-to-origin hop never needs its own TLS.
        run: HTTP=1 yarn servebuild &

      - name: Run changed iOS tests on base (expect failure)
        if: steps.patch.outputs.empty != 'true'
        id: run_tests
        env:
          BROWSERSTACK_USERNAME: ${{ secrets.BROWSERSTACK_USERNAME }}
          BROWSERSTACK_ACCESS_KEY: ${{ secrets.BROWSERSTACK_ACCESS_KEY }}
          BROWSERSTACK_BUILD_NAME: 'TDD - ${{ github.run_id }}'
          BROWSERSTACK_PROJECT_NAME: 'em'
          TUNNEL_TOKEN: ${{ env.TUNNEL_TOKEN }}
          # Same tunnel pool ios.yml uses — see cloudflareTunnelPool.ts. Eliminates this job's
          # previous fallback to an ephemeral *.trycloudflare.com quick tunnel. Note this means a
          # TDD run and an ios.yml run can contend for the pool, since they are in different
          # concurrency groups — that contention is what cloudflareTunnelPool.ts is built to resolve.
          CLOUDFLARE_TUNNEL_POOL: ${{ secrets.CLOUDFLARE_TUNNEL_POOL }}
        run: |
          IOS_FILES=$(echo "${{ needs.detect.outputs.ios_files }}" | base64 -d)

          echo "=== Running changed iOS tests ==="
          echo "$IOS_FILES"

          # wdio --spec filters the config's specs to the changed file(s).
          SPEC_ARGS=""
          for f in $IOS_FILES; do SPEC_ARGS="$SPEC_ARGS --spec $f"; done

          # The verdict is read from the wdio log rather than the exit code: a config that fails to load
          # exits nonzero without running a test, and used to be counted as validation (#4744). The
          # exit code is the pipeline's first command, not tee's.
          LOG="$RUNNER_TEMP/tdd-report.log"
          set +e
          yarn test:ios $SPEC_ARGS 2>&1 | tee "$LOG"
          TEST_EXIT=${PIPESTATUS[0]}
          node .github/scripts/tdd-verdict.cjs --runner wdio --exit-code "$TEST_EXIT" --report "$LOG" --name iOS --skip-label skip-tdd-ios
          VERDICT_EXIT=$?
          set -e

          echo "test_exit=$TEST_EXIT" >> "$GITHUB_OUTPUT"

          exit "$VERDICT_EXIT"

  # ---------------------------------------------------------------------------
  # Summary: single status check that downstream branch protection can require.
  # ---------------------------------------------------------------------------
  summary:
    name: TDD
    runs-on: ubuntu-latest
    if: always()
    needs: [detect, unit, puppeteer, ios]
    steps:
      - name: Evaluate results
        run: |
          DETECT_RESULT="${{ needs.detect.result }}"
          SKIP="${{ needs.detect.outputs.skip }}"
          SKIP_REASON="${{ needs.detect.outputs.skip_reason }}"
          SKIP_UNIT="${{ needs.detect.outputs.skip_unit }}"
          SKIP_PUPPETEER="${{ needs.detect.outputs.skip_puppeteer }}"
          HAS_IOS="${{ needs.detect.outputs.has_ios }}"
          SKIP_IOS="${{ needs.detect.outputs.skip_ios }}"
          IOS_CREDENTIALS="${{ needs.detect.outputs.ios_credentials }}"

          echo "=== TDD Validation Summary ==="

          if [ "$DETECT_RESULT" = "skipped" ]; then
            echo "⏭️  Skipped: No file changes"
            exit 0
          fi

          # Every job below is skipped when detection fails, which would otherwise read as a pass: with
          # nothing classified there is nothing to have validated. Only `failure`, so that a run
          # superseded by a newer push, whose jobs are cancelled, does not report red.
          if [ "$DETECT_RESULT" = "failure" ]; then
            echo "❌ TDD could not classify the changed files, so nothing was validated."
            exit 1
          fi

          if [ "$SKIP" = "true" ]; then
            echo "⏭️  Skipped: $SKIP_REASON"
            exit 0
          fi

          if [ -n "$SKIP_REASON" ]; then
            echo "⏭️  Partial skip: $SKIP_REASON"
          fi

          # Check each job result
          UNIT_RESULT="${{ needs.unit.result }}"
          PUPPETEER_RESULT="${{ needs.puppeteer.result }}"
          IOS_RESULT="${{ needs.ios.result }}"

          echo "Unit:      $UNIT_RESULT"
          echo "Puppeteer: $PUPPETEER_RESULT"
          echo "iOS:       $IOS_RESULT"
          echo ""

          FAILED="false"

          # A job's result says whether it reached a conclusion, and its verdict output says which one
          # (see .github/scripts/tdd-verdict.cjs). The result alone cannot: a job also fails when its
          # tests never ran, and counting that as "tests passed on base" is the confusion #4744 fixed
          # from the other side. A job that succeeds without a verdict is a bug here, not a pass.
          #   success + validated    the tests executed and failed on base
          #   failure + flagged      the tests executed and passed on base (TDD violation)
          #   failure + inconclusive the tests did not run to a failure (config, setup, infrastructure)
          #   failure + no verdict   the job failed before the tests ran
          #   skipped                no changed tests of that type
          evaluate() {
            local name="$1" result="$2" verdict="$3"
            case "$result:$verdict" in
              skipped:*) ;;
              success:validated) echo "✅ $name tests failed on base branch — TDD validated" ;;
              failure:flagged) echo "❌ $name tests passed on base branch — TDD flagged"; FAILED="true" ;;
              failure:inconclusive) echo "❌ $name tests did not run to a failure on base branch — TDD could not validate"; FAILED="true" ;;
              failure:*) echo "❌ $name job failed before its tests ran — TDD could not validate"; FAILED="true" ;;
              success:*) echo "❌ $name job succeeded without a verdict — TDD could not validate"; FAILED="true" ;;
              *) echo "⚠️  $name job $result" ;;
            esac
          }

          evaluate Unit "$UNIT_RESULT" "${{ needs.unit.outputs.verdict }}"
          evaluate Puppeteer "$PUPPETEER_RESULT" "${{ needs.puppeteer.outputs.verdict }}"
          evaluate iOS "$IOS_RESULT" "${{ needs.ios.outputs.verdict }}"

          # Skipped for want of credentials is not a pass, and the check must not read as one.
          IOS_UNVALIDATED="false"
          if [ "$HAS_IOS" = "true" ] && [ "$SKIP_IOS" != "true" ] && [ "$IOS_CREDENTIALS" != "true" ]; then
            echo "⏭️  iOS tests were NOT validated: BrowserStack credentials are not available to this run."
            IOS_UNVALIDATED="true"
          fi

          if [ "$FAILED" = "true" ]; then
            echo ""
            echo "TDD validation failed. Changed tests should fail on the base branch"
            echo "to prove they cover new functionality. If this is intentional, add the"
            echo "'skip-tdd' label to skip all TDD checks, or use 'skip-tdd-unit' /"
            echo "'skip-tdd-puppeteer' / 'skip-tdd-ios' to skip only the relevant job."
            exit 1
          fi

          echo ""
          if [ "$IOS_UNVALIDATED" = "true" ]; then
            echo "✅ TDD validation passed, except the iOS tests, which were not validated."
          else
            echo "✅ TDD validation passed!"
          fi
