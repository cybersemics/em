name: BrowserStack Retry

# Re-runs a BrowserStack run once, on a fresh runner, when it failed only because its runner could
# not reach the Cloudflare edge.
#
# That failure belongs to the runner, not to the code under test. Run 36739868119 spent ten minutes
# unable to get any answer through any of the five tunnels while the same PR's Android run, on
# another runner at the same moment, claimed one and passed in two. The pool now recognises the
# condition and fails fast (see EDGE_UNREACHABLE_EXIT_CODE in cloudflareTunnelPool.ts), and a new
# runner is the one thing that fixes it — so it is worth one automatic retry rather than a red check
# someone has to notice and re-run by hand.
#
# Only that failure is retried. The test job records the launcher's distinct exit code and runs a
# step named "Flag unreachable Cloudflare edge for retry" in exactly that case; this workflow
# re-runs only when that step ran and succeeded. A test failure, a setup failure of any other kind,
# or a genuinely busy pool that ran out its 45-minute wait never runs the step, so it is never
# retried here.
#
# Why a separate workflow rather than a step or job inside ios.yml: GitHub refuses to re-run a
# workflow run that is still in progress, and a job inside the run is by definition still part of
# it. workflow_run fires once the run has completed, when rerun-failed-jobs is allowed. Re-running
# failed jobs gives each one a new GitHub-hosted runner.
on:
  workflow_run:
    workflows: [BrowserStack, BrowserStack Android]
    types: [completed]

# Re-running needs actions: write; finding the PR a run belongs to needs pull-requests: read.
# Declaring any permission zeroes the rest.
permissions:
  actions: write
  pull-requests: read

jobs:
  retry:
    name: Retry on a fresh runner
    runs-on: ubuntu-latest
    # Once only: the retry is attempt 2, whose own completion must not trigger another. Cancelled
    # runs conclude `cancelled`, not `failure`, so a superseded or hand-cancelled run is left alone.
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    steps:
      - name: Re-run if the Cloudflare edge was unreachable
        env:
          GH_TOKEN: ${{github.token}}
          REPO: ${{github.repository}}
          RUN_ID: ${{github.event.workflow_run.id}}
          RUN_NAME: ${{github.event.workflow_run.name}}
          EVENT: ${{github.event.workflow_run.event}}
          HEAD_SHA: ${{github.event.workflow_run.head_sha}}
        run: |
          set -euo pipefail

          flagged=$(gh api "repos/$REPO/actions/runs/$RUN_ID/attempts/1/jobs" --jq '
            [.jobs[].steps[]? | select(.name == "Flag unreachable Cloudflare edge for retry" and .conclusion == "success")]
            | length
          ')
          if [ "$flagged" = "0" ]; then
            echo "$RUN_NAME run $RUN_ID failed for a reason other than an unreachable Cloudflare edge — not retrying."
            exit 0
          fi

          # Both BrowserStack workflows cancel a PR's in-progress run whenever a newer one joins the
          # PR's concurrency group, and a re-run joins it too. Re-running a run whose PR has since
          # moved on would therefore cancel the run for the newer commit and test the stale one in its
          # place. A pull_request_target run's head_sha is the PR's head commit, so the run is still
          # current exactly when an open PR's head is still that commit. Push and workflow_dispatch
          # runs each have a group of their own and cannot displace anything.
          if [ "$EVENT" = 'pull_request_target' ]; then
            current=$(gh api --paginate "repos/$REPO/pulls?state=open&per_page=100" --jq '.[] | select(.head.sha == env.HEAD_SHA) | .number')
            if [ -z "$current" ]; then
              echo "No open PR has $HEAD_SHA as its head any more — a newer run supersedes run $RUN_ID, so not retrying."
              exit 0
            fi
          fi

          echo "$RUN_NAME run $RUN_ID could not reach the Cloudflare edge — re-running its failed jobs on a fresh runner."
          gh api --method POST "repos/$REPO/actions/runs/$RUN_ID/rerun-failed-jobs"
