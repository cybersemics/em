[package]
name = "em"
version = "0.0.0"
description = "A beautiful, minimalistic note-taking app for personal sensemaking."
authors = ["Raine Revere <raine@cybersemics.org>"]
edition = "2021"
rust-version = "1.77.2"

# The library is what the desktop binary and (future) mobile targets share.
[lib]
name = "em_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# The system menu records the key presses that choose its items (see menu::record_key_presses).
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "NSEvent"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString"] }

# Smaller, faster release binaries.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
